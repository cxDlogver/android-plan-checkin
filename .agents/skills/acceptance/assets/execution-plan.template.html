<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>验收执行计划</title>
<style>body{font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;margin:0;color:#1c2935;background:#f4f6f8}main{max-width:1300px;margin:auto;padding:24px}h1{margin:0 0 12px}h2{font-size:19px}a{color:#175ca7}section{background:white;padding:20px;margin:16px 0;border:1px solid #dce2e8;border-radius:8px}header small,.muted{color:#556573}.current{border-left:5px solid #24705b}.next-title{font-size:21px;font-weight:600}.fields{display:grid;grid-template-columns:100px 1fr;gap:7px 14px;margin:12px 0}.fields dt{color:#556573}.fields dd{margin:0;overflow-wrap:anywhere}label,select,input{font:inherit}select,input{padding:7px 10px;border:1px solid #b4c0ca;border-radius:5px}input{min-width:190px;max-width:100%;box-sizing:border-box}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:10px;text-align:left;border-bottom:1px solid #e1e6eb;vertical-align:top}th{background:#f4f7fa;white-space:nowrap}.case{min-width:115px}.row-next{background:#e9f5ef}details{margin-top:6px}summary{color:#175ca7;cursor:pointer}code,pre{font:13px/1.6 Consolas,monospace;overflow-wrap:anywhere;white-space:pre-wrap}ul{padding-left:22px}.status{white-space:nowrap}button{font:inherit;cursor:pointer}.round-link{border:0;background:none;color:#175ca7;text-decoration:underline;padding:0}.notice{color:#694c12}@media(max-width:650px){main{padding:12px}section{padding:14px}.fields{grid-template-columns:68px 1fr}.table-wrap{overflow:auto}}@media(prefers-color-scheme:dark){body{background:#171e24;color:#e2e9ef}section{background:#202b33;border-color:#3c4b56}a,summary,.round-link{color:#86bafa}header small,.muted,.fields dt{color:#b6c3cd}th{background:#293944}th,td{border-color:#3c4b56}.row-next{background:#263e36}select,input{background:#26333e;color:#e2e9ef;border-color:#70808c}.notice{color:#e0c88c}}</style>
<main><header><h1>验收执行计划</h1><small id="meta"></small></header>
<section class="current"><div class="next-title" id="next-title"></div><dl class="fields" id="next-fields"></dl><div id="gate" class="notice"></div></section>
<section><h2>执行规则</h2><div id="rules"></div><p class="notice">这是执行索引的状态快照。查询最新位置请运行下方 next 命令；本页按钮仅查看计划，不启动验收。</p><pre id="commands"></pre></section>
<section><h2>轮次顺序</h2><div class="table-wrap"><table><thead><tr><th>轮次</th><th>总序号</th><th>访问数</th><th>起始用例</th><th>结束用例</th><th>划分依据 / 会话</th><th>进度</th></tr></thead><tbody id="rounds"></tbody></table></div></section>
<section><h2>Test Case 执行清单</h2><div class="controls"><label>轮次 <select id="round-filter"></select></label><label>查找 <input id="search" placeholder="Test Case ID 或操作"></label><span id="count" class="muted"></span></div><div class="table-wrap"><table><thead><tr><th>总序号</th><th>用例与检查</th><th>初态 → 操作 → 预期</th><th>状态</th></tr></thead><tbody id="visits"></tbody></table></div></section>
</main><script type="application/json" id="plan-data">{{EXECUTION_PLAN_JSON}}</script><script>
(()=>{const plan=JSON.parse(document.getElementById('plan-data').textContent),$=id=>document.getElementById(id),labels={not_run:'待验收',queued:'等待前项',ready:'下一项',running:'进行中',passed:'已通过',failed:'失败',blocked:'受阻',stale:'证据失效',partial:'部分完成',recorded:'等待完成提交',active:'当前轮'};function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}function field(key,value){$('next-fields').append(el('dt',key),el('dd',value));}const next=plan.next.visit;$('meta').textContent=`索引快照 ${plan.snapshotId.slice(0,12)} · ${plan.totals.rounds} 轮 · ${plan.totals.visits} 次访问 · ${plan.totals.uniqueCases} 个用例 · 已通过 ${plan.progress.acceptedVisits} 次访问`;$('next-title').textContent=next?`${next.roundId} · 第 ${next.order} 项 · ${next.caseId}`:'全部访问完成';if(next){field('初态',next.given.title);field('操作',next.operation.label);field('预期',next.expected.title);field('检查',next.environments.join(' + '));field('后继',next.successor?next.successor.caseId:'会话收尾');field('查询动作',plan.next.action);}const reasons={begin:'可开始下一访问',repair:'先完成修复','resume-submit':'恢复同一次提交','recover-active-visit':'恢复当前访问','sync-projections':'先恢复视图同步','refresh-implementation':'先恢复当前版实现交接','close-sessions-and-finish':'执行会话收尾与最终门禁'};$('gate').textContent=(reasons[plan.next.action]||plan.next.action)+'：'+plan.next.reason;$('commands').textContent=plan.commandHints.join('\n');$('rules').textContent='严格遵循既定访问顺序；同一用例的必要重复保留。每项全部适用检查通过并同步后继续；失败停在当前项。各轮复用兼容的运行环境。自动按轮暂停与冷恢复须由实际驱动提供并验证；此清单只规划和查询，不执行产品动作。';const filter=$('round-filter');filter.append(new Option('全部轮次','all'));for(const r of plan.rounds){filter.append(new Option(`${r.id} · 第${r.fromOrder}–${r.toOrder}项`,r.id));const tr=el('tr'),td=el('td'),button=el('button',r.id,'round-link');button.type='button';button.addEventListener('click',()=>{filter.value=r.id;render();$('visits').closest('section').scrollIntoView({behavior:'smooth'});});td.append(button);tr.append(td,...[`${r.fromOrder}–${r.toOrder}`,r.visitCount,r.firstCaseId,r.lastCaseId,r.boundaryReasons.map(b=>({'route-start':'路线起点','session-start':'会话起点','independent-fixture':'独立夹具入口','declared-initial-state':'已声明初态'}[b]||b)).join('、')+' / '+r.sessionId,labels[r.status]||r.status].map(v=>el('td',v)));$('rounds').append(tr);}filter.value=next?next.roundId:'all';function render(){const query=$('search').value.trim().toLowerCase(),rows=plan.visits.filter(v=>(filter.value==='all'||v.roundId===filter.value)&&(!query||[v.caseId,v.title,v.operation.label].join(' ').toLowerCase().includes(query)));$('visits').replaceChildren();for(const v of rows){const tr=el('tr',undefined,next&&v.visitIndex===next.visitIndex?'row-next':undefined),id=el('td',undefined,'case');id.append(el('strong',v.caseId),el('div',`${v.roundId} · 本用例第${v.occurrence}/${v.requiredOccurrences}次`,'muted'));id.append(el('div',v.environments.join(' + '),'muted'));const flow=el('td');flow.append(el('div','初态：'+v.given.title),el('div','操作：'+v.operation.label),el('div','预期：'+v.expected.title));const detail=el('details');detail.append(el('summary','查看检查要求与恢复入口'));const list=el('ul');for(const c of v.checks){const li=el('li');li.append(el('strong',`${c.environment} / ${c.aspect}`),el('div',c.criterion),el('div',c.procedure),el('div','必需证据：'+c.evidence.map(e=>e.form).join('、'),'muted'));list.append(li);}detail.append(list,el('div','冷恢复候选：'+(v.coldResume.operations.length?v.coldResume.operations.join(' → '):'允许初态或独立准备')+'；实际恢复需核对对象、输入与 Mock 上下文。'));const link=el('a','查看本用例合同');link.href=v.contractHref;detail.append(link);flow.append(detail);tr.append(el('td',v.order),id,flow,el('td',labels[v.status]||v.status,'status'));$('visits').append(tr);}$('count').textContent=`显示 ${rows.length} 次访问`;}filter.addEventListener('change',render);$('search').addEventListener('input',render);render();})();
</script></html>
