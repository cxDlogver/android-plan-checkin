 body+='<h3>实测结论与证据</h3><p>'+statusText[c.result.status]+'；'+(c.result.observations?'已有观察记录':'尚无实际结果。空槽位不表示通过。')+'</p>'+list(c.evidenceRequirements);

 if(c.kind==='regression')body+='<h3>存量回归理由</h3><p>'+esc(c.impact.existingContract)+'</p><p>'+esc(c.impact.risk)+'</p><p>'+esc(c.impact.whyNotCovered)+'</p>';

function buildGraph(){nodes=[];edges=[];selected=null;
 if(mode==='route'){const r=P.routes.routes[routeIndex];if(r){nodes.push({id:'entry',label:states.get(r.entryStateId).title,x:0,y:0,status:'pending',entry:true,stateId:r.entryStateId});r.steps.forEach((s,i)=>{const c=cases.get(s.caseId);nodes.push({id:'step-'+i,label:(i+1)+'. '+c.title,x:0,y:(i+1)*150,status:c.result.status,caseId:c.id,occ:{r,ri:routeIndex,i}});edges.push({from:i?'step-'+(i-1):'entry',to:'step-'+i,label:trans.get(s.transitionId).event,caseId:c.id,occ:{r,ri:routeIndex,i}})})}else{const h=P.harnessRoutes[routeIndex-P.routes.routes.length];if(h){nodes=[{id:'prep',label:h.title,x:0,y:0,status:'pending',entry:true},{id:'case',label:cases.get(h.caseIds[0]).title,x:0,y:160,status:cases.get(h.caseIds[0]).result.status,caseId:h.caseIds[0]}];edges=[{from:'prep',to:'case',label:'完成宿主测试准备后执行',caseId:h.caseIds[0]}]}}}
 else if(mode==='state'){const depth=new Map(P.stateGraph.entryStateIds.map(x=>[x,0])),q=[...depth.keys()];for(let i=0;i<q.length;i++)for(const t of P.stateGraph.edges)if(t.from===q[i]&&!depth.has(t.to)){depth.set(t.to,depth.get(t.from)+1);q.push(t.to)}const slots={};for(const s of P.stateGraph.nodes){const d=depth.get(s.id)??10,j=slots[d]||0;slots[d]=j+1;const related=P.cases.filter(c=>c.to===s.id),st=related.some(c=>c.result.status==='failed')?'failed':related.length&&related.every(c=>c.result.status==='passed')?'passed':'pending';nodes.push({id:s.id,label:s.title,x:d*340,y:j*135,status:st,stateId:s.id,entry:P.stateGraph.entryStateIds.includes(s.id)})}edges=P.stateGraph.edges.map(t=>({from:t.from,to:t.to,label:t.event,caseId:byTransition.get(t.id).id}))}
 else {const counts={};for(const c of P.cases){const feature=c.featureIds?.[0]||'regression';const fi=[...new Set(P.cases.map(x=>x.featureIds?.[0]||'regression'))].indexOf(feature);const row=counts[feature]||0;counts[feature]=row+1;nodes.push({id:c.id,label:c.title,x:fi*300,y:row*130,status:c.result.status,caseId:c.id})}edges=P.testGraph.edges.map(e=>({...e,label:'流程中的下一项',caseId:e.to}))}
 fit();}
function fit(){if(!nodes.length)return;const maxx=Math.max(...nodes.map(n=>n.x))+W,minx=Math.min(...nodes.map(n=>n.x)),maxy=Math.max(...nodes.map(n=>n.y))+H,miny=Math.min(...nodes.map(n=>n.y));scale=mode==='route'?Math.min(1,(cw-80)/W):Math.min(1,(cw-60)/(maxx-minx),(ch-60)/(maxy-miny));tx=mode==='route'?Math.max(40,(cw-W)/2):30-minx*scale;ty=30-miny*scale;draw()}
function resize(){const r=cv.getBoundingClientRect();cw=r.width;ch=r.height;const d=window.devicePixelRatio||1;cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){ctx.clearRect(0,0,cw,ch);ctx.save();ctx.translate(tx,ty);ctx.scale(scale,scale);edgePaths=[];const map=new Map(nodes.map(n=>[n.id,n])),duplicates={};
 for(const e of edges){const a=map.get(e.from),b=map.get(e.to);if(!a||!b)continue;const k=e.from+'>'+e.to,j=duplicates[k]||0;duplicates[k]=j+1;let x1=a.x+W/2,y1=a.y+H,x2=b.x+W/2,y2=b.y,cx=(x1+x2)/2+Math.min(j,8)*12,cy=(y1+y2)/2;if(e.from===e.to){x1=a.x+W;y1=a.y+25;x2=a.x+W;y2=a.y+60;cx=a.x+W+85;cy=a.y-15}else if(mode!=='route'){x1=a.x+W;y1=a.y+H/2;x2=b.x;y2=b.y+H/2;cx=(x1+x2)/2;cy=(y1+y2)/2+Math.min(j,8)*12}const active=e.caseId===selected;const edgeStatus=cases.get(e.caseId)?.result.status;ctx.strokeStyle=active?'#c44518':edgeStatus==='failed'?'#b93232':edgeStatus==='passed'?'#21804b':mode==='route'?'#577999':'#8b9cb878';ctx.lineWidth=active?3:1.4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();const angle=Math.atan2(y2-cy,x2-cx);ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(angle-.4),y2-10*Math.sin(angle-.4));ctx.lineTo(x2-10*Math.cos(angle+.4),y2-10*Math.sin(angle+.4));ctx.fill();const points=[];for(let i=0;i<=20;i++){const t=i/20;points.push({x:(1-t)**2*x1+2*(1-t)*t*cx+t*t*x2,y:(1-t)**2*y1+2*(1-t)*t*cy+t*t*y2})}edgePaths.push({e,points});if(active||mode==='route'){ctx.fillStyle='#365777';ctx.font='12px sans-serif';ctx.fillText(e.label.slice(0,20),cx+14,cy)}}
 for(const n of nodes){ctx.fillStyle=color[n.status];ctx.strokeStyle=n.entry?'#204f7d':n.caseId===selected?'#bd461b':'#7f96b0';ctx.lineWidth=n.entry?3:1.3;ctx.fillRect(n.x,n.y,W,H);ctx.strokeRect(n.x,n.y,W,H);ctx.fillStyle='#142b43';ctx.font='14px sans-serif';const chars=[...n.label];for(let i=0;i<3;i++){let line=chars.slice(i*14,(i+1)*14).join('');if(i===2&&chars.length>42)line+='…';ctx.fillText(line,n.x+12,n.y+22+i*19)}ctx.font='10px sans-serif';ctx.fillStyle='#536a82';ctx.fillText(n.entry?'流程起点':statusText[n.status],n.x+12,n.y+78)}ctx.restore()}
function point(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-tx)/scale,y:(ev.clientY-r.top-ty)/scale}}
function nodeAt(p){return [...nodes].reverse().find(n=>p.x>=n.x&&p.x<=n.x+W&&p.y>=n.y&&p.y<=n.y+H)}
function distance(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
cv.addEventListener('pointerdown',ev=>{const p=point(ev);drag={x:ev.clientX,y:ev.clientY,lastX:ev.clientX,lastY:ev.clientY,node:nodeAt(p),moved:false};cv.setPointerCapture(ev.pointerId)});
cv.addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-drag.lastX,dy=ev.clientY-drag.lastY;if(Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>4)drag.moved=true;if(drag.node){drag.node.x+=dx/scale;drag.node.y+=dy/scale}else{tx+=dx;ty+=dy}drag.lastX=ev.clientX;drag.lastY=ev.clientY;draw()});
cv.addEventListener('pointerup',ev=>{if(!drag)return;if(!drag.moved){const p=point(ev),n=nodeAt(p);if(n){if(n.caseId)showCase(n.caseId,n.occ);else if(n.stateId)showState(n.stateId)}else{const hit=edgePaths.find(x=>x.points.slice(1).some((b,i)=>distance(p,x.points[i],b)<7/scale));if(hit)showCase(hit.e.caseId,hit.e.occ)}}drag=null});
cv.addEventListener('wheel',ev=>{ev.preventDefault();const p=point(ev),r=cv.getBoundingClientRect();scale=Math.max(.05,Math.min(2.5,scale*(ev.deltaY<0?1.15:1/1.15)));tx=ev.clientX-r.left-p.x*scale;ty=ev.clientY-r.top-p.y*scale;draw()},{passive:false});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));buildGraph()});
$('route').onchange=()=>{routeIndex=Number($('route').value);mode='route';document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode==='route'));buildGraph()};$('fit').onclick=fit;$('zoomIn').onclick=()=>{scale=Math.min(2.5,scale*1.25);draw()};$('zoomOut').onclick=()=>{scale=Math.max(.05,scale/1.25);draw()};$('overview').onclick=overview;
$('search').oninput=()=>{const q=$('search').value.trim();$('findResults').innerHTML='';if(!q)return;const found=mode==='state'?P.stateGraph.nodes.filter(x=>x.title.includes(q)):P.cases.filter(x=>x.title.includes(q));for(const c of found.slice(0,30)){const b=document.createElement('button');b.textContent=c.title;b.onclick=()=>{mode==='state'?showState(c.id):showCase(c.id);$('findResults').innerHTML=''};$('findResults').appendChild(b)}};
window.addEventListener('resize',resize);resize();buildGraph();
</script></html>
