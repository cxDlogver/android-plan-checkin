<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计划打卡 · UI需求分析</title>
<style>
:root{color-scheme:light;--ink:#203139;--muted:#5c6d70;--line:#dce4e3;--accent:#176b5b;--soft:#e6f2eb;--paper:#fff;--bg:#f3f5f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}header{background:#173d34;color:#fff;padding:30px max(24px,4vw) 24px}header p{margin:5px 0;color:#d7e5db}h1{font-size:29px;letter-spacing:.03em;margin:0 0 8px}h2{font-size:21px;margin:0 0 16px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0}.kicker{font-size:12px;letter-spacing:.16em;color:#bad6c8}.badge{display:inline-flex;align-items:center;border-radius:5px;background:#f7edcf;color:#694a0c;padding:3px 10px;font-size:12px}.metrics{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px}.metric strong{font-size:27px;display:block}.metric span{font-size:12px;color:#d7e5db}.notice{padding:12px 4vw;background:#fff5dc;color:#6a4e20;border-bottom:1px solid #eadfc1}.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:16px 4vw;border-bottom:1px solid var(--line);background:#fff}.tabs button,.nav-buttons button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 16px;color:var(--ink)}.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.layout{max-width:1640px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding:24px 4vw}aside{align-self:start;position:sticky;top:16px;max-height:91vh;overflow:auto}input{width:100%;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:12px}.frame-list{display:flex;flex-direction:column;gap:4px}.frame-list button{display:flex;text-align:left;gap:10px;border:1px solid transparent;background:transparent;border-radius:6px;padding:10px 9px;color:var(--ink)}.frame-list button[aria-current=true]{background:var(--soft);border-color:#bad2c4}.frame-list .num{font-size:12px;color:var(--muted);min-width:22px;padding-top:2px}.frame-list .frame-label{font-size:13px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;min-width:0}.summary-line{color:var(--muted);font-size:13px}.detail-layout{display:grid;grid-template-columns:minmax(240px,410px) minmax(280px,1fr);gap:28px;margin-top:22px}.image-shell{background:#e8ecec;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:78vh;overflow:auto;align-self:start}.image-shell img{display:block;width:393px;max-width:100%;height:auto;margin:auto}.caption{font-size:12px;color:var(--muted);margin-top:6px}.region{border-left:3px solid #b3cfc0;padding:2px 0 2px 15px;margin:20px 0}.region ul{margin:4px 0;padding-left:20px}.subtle{font-size:13px;color:var(--muted)}.label{display:block;font-size:12px;letter-spacing:.03em;color:var(--accent);margin-top:16px;font-weight:650}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);background:#f7f9f5;border-radius:4px;padding:3px 8px;font-size:12px}.boundary{background:#f6f7f3;border-radius:6px;padding:14px;margin:16px 0}.nav-buttons{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.stack{display:grid;gap:16px}.source-row{border-top:1px solid var(--line);padding:14px 0}.source-row:first-child{border:0}.source-tag{font-size:12px;font-weight:650;color:var(--accent)}.status{font-size:12px;white-space:nowrap;background:#eef3ed;padding:3px 8px;border-radius:3px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}.color-dot{display:inline-block;width:11px;height:11px;vertical-align:middle;border:1px solid #a6b3ad;border-radius:2px;margin-right:6px}details{margin:14px 0}summary{cursor:pointer;color:var(--accent);font-size:13px}.wide{grid-column:1/-1}.empty{color:var(--muted);padding:20px}.hidden,[hidden]{display:none!important}.token-value{overflow-wrap:anywhere}.source-list{padding-left:20px}.footer{max-width:1640px;padding:0 4vw 30px;margin:auto;color:var(--muted);font-size:12px}.limitation{background:#fff6e3;padding:16px;border-radius:6px;border:1px solid #eadfc1;margin-bottom:14px}.mini{font-size:12px}.muted-heading{margin:22px 0 8px}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #d5a953;outline-offset:3px}@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.detail-layout{grid-template-columns:1fr}.image-shell{max-height:68vh}.detail-copy{max-width:720px}}@media(max-width:680px){header{padding:22px}h1{font-size:23px}.layout{display:block;padding:16px}aside{position:static;max-height:230px;margin-bottom:16px}.frame-list{display:grid;grid-template-columns:1fr 1fr}.panel{padding:18px}.tabs{padding:12px 16px}.tabs button{padding:7px 10px;font-size:13px}.metrics{gap:18px}.metric strong{font-size:23px}.detail-layout{gap:18px}.footer{padding:0 16px 24px}}
</style></head><body>
<header><div class="kicker">PLAN CHECK-IN / REQUIREMENTS WORK IN PROGRESS</div><h1>计划打卡 · 视觉资料整理</h1><p>保留当前设计观察，供规范需求分析继续使用。</p><div class="badge">需求分析未完成 · 双图尚缺</div><div class="metrics"><div class="metric"><strong>1</strong><span>来源需求：UI-001</span></div><div class="metric"><strong id="frame-count">23</strong><span>已读画板场景</span></div><div class="metric"><strong id="region-count"></strong><span>区域检查点</span></div><div class="metric"><strong>8</strong><span>原文验收检查点</span></div></div></header>
<div class="notice">本轮UI视觉稿样式对齐需求已明确，当前未发现需用户补答的范围内歧义。此页仍是过程资料，尚缺规范要求的双图与原子需求；这是分析产物未完成，不能归因为PRD缺少范围外的业务流程。</div>
<nav class="tabs" aria-label="分析视图"><button data-tab="frames" aria-selected="true">画板对照</button><button data-tab="coverage" aria-selected="false">来源覆盖</button><button data-tab="shared" aria-selected="false">公共视觉参数</button><button data-tab="scope" aria-selected="false">范围与限制</button></nav>
<div class="layout"><aside id="sidebar"><label class="label" for="search">画板与场景</label><input id="search" placeholder="搜索画板名称或局部内容" aria-label="搜索画板"><div id="frame-list" class="frame-list"></div></aside><main id="main" class="panel" aria-live="polite"></main></div>
<footer class="footer">过程资料 · 图片和数据均内嵌，可离线阅读。双图、原子需求与完整验收仍为通用规范的必需交付，当前尚未完成。</footer>
<script id="analysis-data" type="application/json">__ANALYSIS_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('analysis-data').textContent);const main=document.getElementById('main');let active=1;let tab='frames';
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=String(text);if(cls)e.className=cls;return e;}
function list(items){const ul=el('ul');for(const text of items)ul.append(el('li',text));return ul;}
function section(title,items){const box=el('section');box.append(el('h3',title));box.append(list(items));return box;}
function chips(items){const box=el('div',null,'chips');for(const item of items)box.append(el('span',item,'chip'));return box;}
function table(headers,rows){const t=el('table');const head=el('thead');const row=el('tr');headers.forEach(h=>row.append(el('th',h)));head.append(row);t.append(head);const body=el('tbody');for(const r of rows){const tr=el('tr');r.forEach(c=>tr.append(el('td',c)));body.append(tr);}t.append(body);return t;}
function renderNav(){const text=document.getElementById('search').value.trim().toLowerCase();const box=document.getElementById('frame-list');box.replaceChildren();for(const s of data.scenarios){if(text&&!JSON.stringify([s.title,s.condition,s.regions]).toLowerCase().includes(text))continue;const b=el('button');b.type='button';b.setAttribute('aria-current',String(active===s.order));b.append(el('span',String(s.order).padStart(2,'0'),'num'),el('span',s.title,'frame-label'));b.addEventListener('click',()=>select(s.order));box.append(b);}if(!box.children.length)box.append(el('p','没有匹配的画板','empty'));}
function select(order){active=order;tab='frames';history.replaceState(null,'','#frame-'+order);render();}
function styleText(n){const values=[];const labels={fontSize:'字号（sp）',fontWeight:'字重',cornerRadius:'圆角（dp）',gap:'间距（dp）',padding:'内边距（dp）',width:'宽度（dp）',height:'高度（dp）'};const readable=v=>Array.isArray(v)?v.map(readable).join(' / '):({fill_container:'随容器铺满',fit_content:'随内容',normal:'常规',bold:'粗体'}[v]??v);const color=v=>typeof v==='string'&&v.startsWith('$')?(data.tokens.colors[v.slice(1)]??v):v;for(const k of Object.keys(labels))if(n[k]!==undefined)values.push(labels[k]+'：'+readable(n[k]));if(typeof n.fill==='string')values.push('填充：'+color(n.fill));if(n.fill&&typeof n.fill==='object')values.push('填充：'+({linear:'线性',radial:'径向'}[n.fill.gradientType]??n.fill.gradientType)+'渐变 · 设计角度'+n.fill.rotation+'°');if(n.stroke)values.push('边框：'+(typeof n.stroke==='string'?color(n.stroke):'设计渐变'));return values.join('；');}
function renderFrame(){const s=data.scenarios.find(x=>x.order===active);main.append(el('div','图 '+String(s.order).padStart(2,'0')+' · '+s.canvasSize.width+' × '+s.canvasSize.height+' dp · PNG '+s.pngSize.join(' × '),'summary-line'));main.append(el('h2',s.title),el('p',s.condition));const layout=el('div',null,'detail-layout');const figure=el('figure');figure.style.margin='0';const shell=el('div',null,'image-shell');const img=el('img');img.src=s.imageData;img.alt='图'+s.order+' '+s.title+'设计参考';img.width=393;img.height=s.pngSize[1]/2;shell.append(img);figure.append(shell,el('figcaption','原始导出图按393逻辑宽度显示。长画板可在图框内滚动，比例保持不变。','caption'));const copy=el('div',null,'detail-copy');copy.append(section('当前可确定的界面事实',s.facts));const difference=el('div',null,'boundary');difference.append(el('h3','为什么保留这个对照场景'),el('p',s.distinction));copy.append(difference);copy.append(el('span','局部对齐目标','label'));for(const region of s.regions){const item=el('section',null,'region');item.append(el('h3',region.name),list(region.checks));const detail=el('details');detail.append(el('summary','查看对应设计区域'));detail.append(list([...new Set(region.nodeRefs.map(n=>n.name+(n.content?' · '+n.content:'')))]));item.append(detail);copy.append(item);}copy.append(el('span','可变展示参数','label'),chips(s.parameters),section('本轮边界',s.excluded));copy.append(el('p','来源：需求文档第3节图'+String(s.order).padStart(2,'0')+'；对应PNG；设计树画板 '+s.frameId+'。公共要求适用，局部节点优先。','subtle'));const nodes=el('details');nodes.append(el('summary','查看此画板的局部设计参数'));const selected=data.designDetails[s.frameId].filter(n=>n.type==='text'||n.type==='ref');nodes.append(table(['设计节点／展示样例','已给出的参数'],selected.map(n=>[n.name+(n.content?' · '+n.content:''),styleText(n)])));copy.append(nodes);layout.append(figure,copy);main.append(layout);const nav=el('div',null,'nav-buttons');const prev=el('button','← 上一画板');prev.disabled=active===1;prev.onclick=()=>select(active-1);const next=el('button','下一画板 →');next.disabled=active===data.scenarios.length;next.onclick=()=>select(active+1);nav.append(prev,next);main.append(nav);}
function readableTarget(t){return t.replace(/C(\d{2})[–—-]C(\d{2})/g,(_,a,b)=>data.sharedConstraints.filter(c=>Number(c.id.slice(1))>=Number(a)&&Number(c.id.slice(1))<=Number(b)).map(c=>c.title).join('、')).replace(/\bC\d{2}\b/g,id=>data.sharedConstraints.find(c=>c.id===id)?.title??id).replace(/regions/g,'区域检查点').replace(/facts/g,'界面事实');}
function renderCoverage(){main.append(el('h2','来源覆盖清单'),el('p','逐项从原文追踪到页面、局部目标、公共约束或范围处置；再反查每个场景的来源和区分理由。以下不表示产品验收结果。'));main.append(table(['验收点','对应目标','判定含义'],data.acceptance.map(a=>[a.id+' '+a.title,readableTarget(a.target),a.interpretation])));main.append(el('h3','需求条款的逐项处置','muted-heading'));for(const row of data.coverage){const box=el('div',null,'source-row');box.append(el('div','第'+row.line+'行 · '+row.section,'source-tag'),el('p',row.text));box.append(el('span',row.disposition,'status'),el('p','对应：'+row.targets.map(readableTarget).join('、'),'subtle'));main.append(box);}}
function renderShared(){main.append(el('h2','公共视觉参数'),el('p','令牌用于核对已有视觉要求；局部节点优先。没有提供的交互、触控验收或设备矩阵不会由令牌附注自动扩入范围。'));for(const c of data.sharedConstraints){const box=el('div',null,'source-row');box.append(el('h3',c.title),list(c.checks),el('p','来源：'+c.source,'subtle'));main.append(box);}main.append(el('h3','颜色令牌','muted-heading'));const colorTable=table(['令牌','色值'],Object.entries(data.tokens.colors));for(const row of [...colorTable.tBodies[0].rows]){const dot=el('span',null,'color-dot');dot.style.background=row.cells[1].textContent;row.cells[1].prepend(dot);}main.append(colorTable);main.append(el('h3','完整渐变色标 · 角度为设计原值','muted-heading'));for(const [name,g]of Object.entries(data.tokens.gradients)){main.append(el('p',name+' · '+g.rotation+'°','source-tag'),table(['位置','颜色'],g.colors.map(c=>[c.position,c.color])));}main.append(el('h3','阴影令牌','muted-heading'));for(const [name,effects]of Object.entries(data.tokens.effects))main.append(el('h3',name),table(['类型','偏移x / y','模糊','颜色／透明度'],effects.map(e=>[e.shadowType,e.offset.x+' / '+e.offset.y,e.blur,e.color])));}
function renderScope(){
main.append(el('h2','范围、分析决定与限制'));
const clarity=data.clarityAssessment;
main.append(el('h3','需求明确性评估'),el('p',clarity.summary,'boundary'),table(['维度','结论','依据'],clarity.checks.map(c=>[c.dimension,c.conclusion,c.source])));
main.append(section('纳入本轮',data.scopeText.included),section('本轮范围外',data.scopeText.excluded),el('p','观察层级：'+data.scopeText.abstraction,'boundary'));
for(const l of data.limitations){const box=el('div',null,'limitation');box.append(el('p',l.detail),el('p',l.impact,'subtle'));main.append(box);}
main.append(el('h3','已采用的有来源分析决定','muted-heading'));
for(const d of data.decisions){const box=el('div',null,'source-row');box.append(el('h3',d.topic),el('p',d.resolution),el('p',d.source,'subtle'));main.append(box);}
const openQuestions=data.questions.filter(q=>q.status==='open');
main.append(section('需用户澄清的问题',openQuestions.length?openQuestions.map(q=>q.question):['当前未发现范围内待澄清的需求歧义。']));
main.append(section('已关闭的范围外问题',data.questions.filter(q=>q.status==='out_of_scope').map(q=>q.question+' '+q.resolution)));
main.append(el('h3','分析产物状态','muted-heading'),el('p',clarity.methodIssue));
}
function render(){document.getElementById('sidebar').hidden=tab!=='frames';main.classList.toggle('wide',tab!=='frames');document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));main.replaceChildren();if(tab==='frames')renderFrame();else if(tab==='coverage')renderCoverage();else if(tab==='shared')renderShared();else renderScope();renderNav();}
document.getElementById('frame-count').textContent=data.scenarios.length;document.getElementById('region-count').textContent=data.scenarios.reduce((sum,s)=>sum+s.regions.length,0);document.getElementById('search').addEventListener('input',renderNav);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});const match=location.hash.match(/^#frame-(\d+)$/);if(match&&data.scenarios.some(s=>s.order===Number(match[1])))active=Number(match[1]);render();
</script></body></html>
