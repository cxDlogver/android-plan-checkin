'use strict';
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);

const names=[...D.states.map(s=>[s.id,s.title]),...D.features.map(f=>[f.id,f.title]),...D.requirements.map(r=>[r.id,r.title]),...D.transitions.map(t=>[t.id,t.event]),...D.sources.map(s=>[s.id,s.kind==='human'?'人工作答':s.uri.split(/[\\/]/).pop()])].sort((a,b)=>b[0].length-a[0].length);

const uncoveredRequirements=new Set(D.requirementGraph.reduction.uncoveredRequirementIds);
function human(v){const original=String(v??'');if(humanCache.has(original))return humanCache.get(original);let text=original;for(const [id,title]of names){text=text.split('[['+id+']]').join(title);if(id.length<2||!/[.:-]/.test(id))continue;let output='',cursor=0,index;while((index=text.indexOf(id,cursor))!==-1){const left=text[index-1]||'',right=text[index+id.length]||'',boundary=!/[A-Za-z0-9_.:-]/.test(left)&&!/[A-Za-z0-9_.:-]/.test(right);output+=text.slice(cursor,index)+(boundary?title:id);cursor=index+id.length;}text=output+text.slice(cursor);}for(const [a,b]of [['selectedDate','选中日期'],['browseMonth','浏览月份'],['currentFilter','当前筛选'],['weekDenominator','已结束完整有效周数'],['today','今天']])text=text.split(a).join(b);const translated=text.replace(/\btrue\b/g,'无其他附加条件').replace(/\bBack\b/g,'返回键').replace(/\btab\b/gi,'入口').replace(/\bctx\b/g,'来源页面').replace(/\bmode\b/g,'操作方式').replace(/\bfacts\b/g,'状态要求');humanCache.set(original,translated);return translated;}
function el(tag,text,parent,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=human(text);if(cls)e.className=cls;if(parent)parent.append(e);return e;}
function btn(text,fn,parent){const b=el('button',text,parent);b.type='button';b.onclick=fn;return b;}

function sourceLabel(id){const s=sources.get(id);return s?human((s.kind==='human'?'人工作答':s.uri.split(/[\\/]/).pop())+' · '+s.locator):'来源待核对';}
function options(host,rows,value){host.replaceChildren();for(const row of rows){const o=el('option',row.label,host);o.value=row.value;}host.value=value;}
const canvas=$('graph'),ctx=canvas.getContext('2d'),mini=$('minimap'),mc=mini.getContext('2d');
let mode='state',rootChoice='all',selected=null,hover=null,drag=null,framePending=false,geometries=[],bounds=null,viewport={w:1200,h:720,dpr:1},miniView=null;
const layouts={state:JSON.parse(JSON.stringify(D.layout.positions)),requirement:JSON.parse(JSON.stringify(D.requirementLayout.positions))},views={state:{x:0,y:0,scale:.9},requirement:{x:0,y:0,scale:.85}};

function selectedState(){if(!selected)return null;if(selected.kind==='state')return selected.id;if(selected.kind==='transition')return transitions.get(selected.id).to;if(selected.kind==='requirement')return transitions.get(requirements.get(selected.id).transitionId).to;return null;}

function routeSelection(){const id=selectedState();return id?routeFor(id):null;}
function sentence(t){return '在“'+states.get(t.from).title+'”时，'+(t.guard==='true'?'':'当'+human(t.guard)+'时，')+human(t.event)+'，到达“'+states.get(t.to).title+'”。';}
function routeText(info){if(!D.starts.length)return '真实起点及到达链路尚未确定，当前分析未完成。';if(!info)return '当前起点无法到达该状态，需核对链路，不能编造进入路径。';return '从“'+states.get(info.start).title+'”开始。'+info.route.map(id=>sentence(transitions.get(id))).join('')+(info.route.length?'':'当前状态就是流程起点。');}

function graphBounds(){const ps=Object.values(graph().positions);if(!ps.length)return {x:0,y:0,w:400,h:300};const x=Math.min(...ps.map(p=>p.x))-100,y=Math.min(...ps.map(p=>p.y))-100;return {x,y,w:Math.max(...ps.map(p=>p.x+p.w))-x+160,h:Math.max(...ps.map(p=>p.y+p.h))-y+100};}
function centerNode(id){const p=position(id);if(!p)return;const v=views[mode];v.x=viewport.w*.34-(p.x+p.w/2)*v.scale;v.y=viewport.h*.42-(p.y+p.h/2)*v.scale;queueDraw();}
function focusStart(){const g=graph(),id=mode==='state'?(rootChoice==='all'?D.starts[0]:rootChoice):g.nodes.find(n=>n.from===(rootChoice==='all'?D.starts[0]:rootChoice))?.id;if(id)centerNode(id);else fit();}
function fit(){bounds=graphBounds();const v=views[mode];v.scale=Math.min(1.15,Math.max(.035,Math.min((viewport.w-90)/bounds.w,(viewport.h-90)/bounds.h)));v.x=(viewport.w-bounds.w*v.scale)/2-bounds.x*v.scale;v.y=(viewport.h-bounds.h*v.scale)/2-bounds.y*v.scale;queueDraw();}
function zoomAt(factor,x=viewport.w/2,y=viewport.h/2){const v=views[mode],p=world(x,y);v.scale=Math.min(2.5,Math.max(.035,v.scale*factor));v.x=x-p.x*v.scale;v.y=y-p.y*v.scale;queueDraw();}
function curve(edge,index,total){const ps=graph().positions,a=ps[edge.from],b=ps[edge.to],ay=a.y+a.h/2,by=b.y+b.h/2,offset=(index-(total-1)/2)*Math.min(7,45/total);let p0,p1,p2,p3;if(edge.from===edge.to){p0={x:a.x+a.w,y:ay-18};p3={x:a.x+a.w,y:ay+18};const rail=a.x+a.w+80+index*16;p1={x:rail,y:ay-95};p2={x:rail,y:ay+95};}else if(b.x>a.x+20){p0={x:a.x+a.w,y:ay+offset};p3={x:b.x,y:by+offset};const bend=Math.max(80,(p3.x-p0.x)*.45);p1={x:p0.x+bend,y:p0.y};p2={x:p3.x-bend,y:p3.y};}else if(b.x<a.x-20){p0={x:a.x,y:ay+offset};p3={x:b.x+b.w,y:by+offset};const railY=Math.min(a.y,b.y)-55-((index+total)%9)*13;p1={x:p0.x-90,y:railY};p2={x:p3.x+90,y:railY};}else{p0={x:a.x+a.w,y:ay+offset};p3={x:b.x+b.w,y:by+offset};const rail=a.x+a.w+85+index*12;p1={x:rail,y:p0.y};p2={x:rail,y:p3.y};}const sample=[];for(let i=0;i<=24;i++){const t=i/24,u=1-t;sample.push({x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y});}return {edge,p0,p1,p2,p3,sample,box:{x:Math.min(p0.x,p1.x,p2.x,p3.x),y:Math.min(p0.y,p1.y,p2.y,p3.y),r:Math.max(p0.x,p1.x,p2.x,p3.x),b:Math.max(p0.y,p1.y,p2.y,p3.y)}};}
function rounded(context,p,r){context.beginPath();context.moveTo(p.x+r,p.y);context.lineTo(p.x+p.w-r,p.y);context.quadraticCurveTo(p.x+p.w,p.y,p.x+p.w,p.y+r);context.lineTo(p.x+p.w,p.y+p.h-r);context.quadraticCurveTo(p.x+p.w,p.y+p.h,p.x+p.w-r,p.y+p.h);context.lineTo(p.x+r,p.y+p.h);context.quadraticCurveTo(p.x,p.y+p.h,p.x,p.y+p.h-r);context.lineTo(p.x,p.y+r);context.quadraticCurveTo(p.x,p.y,p.x+r,p.y);context.closePath();}
function wrapText(text,width,font){ctx.font=font;const lines=[];let line='';for(const char of Array.from(human(text))){if(ctx.measureText(line+char).width>width&&line){lines.push(line);line=char;}else line+=char;}if(line)lines.push(line);return lines;}

function transitionDetail(id){const edge=transitions.get(id),req=requirements.get(edge.requirementId),target=states.get(edge.to),host=setDetail('原子需求 · 一次状态迁移',edge.event);const relation=el('div',undefined,host,'transition-summary');el('div',states.get(edge.from).title,relation,'state-label');el('div','→',relation);el('div',target.title,relation,'state-label');el('p','触发操作：'+edge.event,host);el('p',edge.guard==='true'?'条件：无其他附加条件':'条件：'+edge.guard,host,'condition');transitionWitness(id,host);const f=block('功能要求与明确结果',host);assertions(req,f);if(edge.selfLoopEvidence){const p=edge.selfLoopEvidence;el('h4','这次操作必须满足',f);el('p',p.obligation,f);el('h4','为何仍属于同一状态',f);el('p',p.stateReason,f);for(const ref of p.sourceRefs)el('p',sourceLabel(ref.sourceId)+' · '+ref.locator.replace(/；(?:证据\s*)?_process[\\/]evidence[\\/][^\s]+\s*(第[^\n]*)$/,'（$1）'),f,'source');}visual([...(req.uiRefs||[]),...(target.uiRefs||[])],[...target.facts.filter(isVisual),...req.acceptance.flatMap(ac=>ac.then.filter(isVisual))],[...edge.sourceIds,...req.sourceIds,...target.sourceIds],host);const nav=block('查看状态链路',host);btn('查看起始状态的完整链路',()=>selectState(edge.from),nav);btn('查看目标状态的完整链路',()=>selectState(edge.to),nav);showSources([...edge.sourceIds,...req.sourceIds],host);reviewQuestions([edge.id,req.id,edge.from,edge.to],host);}

function coverageStatus(){if(!D.transitions.length||!D.requirements.length)return '迁移与原子需求尚未建立，分析未完成';const p=D.requirementGraph.traversal;if(p.status==='infeasible')return '无法构成完整覆盖路线';if(p.status==='partial')return '部分需求未覆盖';if(p.routes.some(r=>r.contextCheck.status==='conflict'))return '存在条件冲突，不能执行';if(p.routes.some(r=>r.contextCheck.status==='incomplete'))return '条件检查未完成';if(p.routes.some(r=>r.contextCheck.status==='not_modeled'))return '业务条件未建模';return p.optimality==='not_proven'?'各段已编码条件通过；全局最短未证明':'达到结构访问下界，已编码条件通过；仍待语义审查';}
function coverageDetail(){selected=null;const p=D.requirementGraph.traversal,host=setDetail('分段覆盖路线','每段从真实起点出发，段内连续执行');el('p',coverageStatus(),host,'condition');if(!D.transitions.length||!D.requirements.length){el('p','现有资料仅能支持草稿，迁移、对应原子需求和连续路线需要继续分析。',host,'empty');queueDraw();return;}el('p','共 '+D.requirements.length+' 项需求，当前访问 '+p.totalVisits+' 次，其中重复访问 '+p.repeatedVisits+' 次。图中保留 '+D.requirementGraph.edges.length+' 条实际用到的有向衔接。',host,'narrative');if(p.optimality==='not_proven')el('p','忽略业务条件时的访问下界为 '+p.lowerBoundVisits+' 次；当前方案已验证条件，但没有证明全局最短。',host,'condition');el('p',p.restartPolicy==='documented_entries'?'各段从真实起点独立开始，并须具备本段所列初始条件。重新进入应用不会自动清空或改变业务数据；分段之间没有业务箭头。当前计算未证明前一段留下的数据满足下一段；不能将各段解释为只需退出重进的一次完整操作。':'沿单条连续路线行走，不允许隐式重启。',host);el('p','已编码条件通过不等于应用功能测试通过；真实数据准备、来源语义和未编码条件仍需审查。',host,'muted');if(!p.routes.length)el('p','当前没有完成覆盖；不能把未覆盖需求临时提升为起点。',host,'empty');for(const [index,r] of p.routes.entries()){const section=block('第 '+(index+1)+' 段 · 从“'+states.get(r.entryStateId).title+'”开始 · '+r.requirementIds.length+' 次访问',host);const c=r.contextCheck;el('p',c.status==='finite_domain_passed'||c.status==='no_guard_constraints'?'已编码条件重放通过。':'条件尚未通过，不能作为可执行顺序。',section,'condition');contextConditions(c.initialContext,section);const more=el('details',undefined,section);el('summary','展开完整中文路线（'+r.requirementIds.length+' 步，重复步骤保留）',more);const ol=el('ol',undefined,more,'steps');for(const tid of r.transitionIds){const li=el('li',undefined,ol);btn(sentence(transitions.get(tid)),()=>selectRequirement(transitions.get(tid).requirementId),li).className='step-action';}}queueDraw();}
function selectState(id){selected={kind:'state',id};stateDetail(id);queueDraw();}
function selectTransition(id){selected={kind:'transition',id};transitionDetail(id);queueDraw();}
function selectRequirement(id){selected={kind:'requirement',id};transitionDetail(requirements.get(id).transitionId);el('p','覆盖路线中访问 '+(D.requirementGraph.traversal.visitCounts[id]||0)+' 次。'+coverageStatus(),$('detail-body'),'condition');if(uncoveredRequirements.has(id)){$('detail-status').textContent+=' · 未覆盖：尚未被连续覆盖路线覆盖';el('p',D.requirementGraph.reduction.unreachableRequirementIds.includes(id)?'当前需求没有从已声明真实起点出发的结构路径，保留为未完成项，不能当作新入口。':'当前需求在结构上可从真实起点到达，但尚未形成满足当前连续覆盖约束的整体路线；可达不等于可以连续走完全部需求。',$('detail-body'),'condition');}queueDraw();}
function selectNode(id){if(mode==='state')selectState(id);else selectRequirement(id);}
function selectEdge(id){if(mode==='state')selectTransition(id);else{selected={kind:'continuation',id};continuationDetail(id);queueDraw();}}
function closeDetails(){$('details').hidden=true;}
function renderTargets(){const q=$('search').value.trim().toLowerCase(),rows=graph().nodes.filter(n=>human(n.title+' '+(n.transitionId?transitions.get(n.transitionId)?.event:'')).toLowerCase().includes(q)).map(n=>({value:n.id,label:(mode==='requirement'&&uncoveredRequirements.has(n.id)?'未覆盖 · ':'')+n.title}));options($('target'),[{value:'',label:rows.length?'定位到…':'没有匹配节点'},...rows],'');}
function switchMode(next){mode=next;$('coverage-route').hidden=mode!=='requirement';selected=null;hover=null;closeDetails();$('state-mode').setAttribute('aria-pressed',String(mode==='state'));$('requirement-mode').setAttribute('aria-pressed',String(mode==='requirement'));renderTargets();focusStart();queueDraw();}
function resize(){const header=$('header').getBoundingClientRect().height;document.documentElement.style.setProperty('--header-height',header+'px');const rect=$('stage').getBoundingClientRect();viewport={w:rect.width||window.innerWidth,h:rect.height||window.innerHeight-header,dpr:window.devicePixelRatio||1};canvas.width=Math.round(viewport.w*viewport.dpr);canvas.height=Math.round(viewport.h*viewport.dpr);queueDraw();}
$('root-choice').disabled=!D.starts.length;$('locate-start').disabled=!D.starts.length;options($('root-choice'),[{value:'all',label:D.starts.length?'全部真实起点 · 自动取最短链路':'尚未确定真实起点'},...D.starts.map(id=>({value:id,label:states.get(id).title}))],'all');$('root-choice').onchange=()=>{rootChoice=$('root-choice').value;const snapshot=selected;if(snapshot){if(snapshot.kind==='state')stateDetail(snapshot.id);else if(snapshot.kind==='transition')transitionDetail(snapshot.id);else if(snapshot.kind==='requirement')selectRequirement(snapshot.id);}focusStart();queueDraw();};$('search').oninput=renderTargets;$('target').onchange=()=>{const id=$('target').value;if(id){selectNode(id);centerNode(id);}};$('state-mode').onclick=()=>switchMode('state');$('requirement-mode').onclick=()=>switchMode('requirement');$('close-details').onclick=closeDetails;$('locate-start').onclick=focusStart;$('coverage-route').onclick=coverageDetail;$('validation-summary').onclick=validationDetail;
$('fit').onclick=fit;$('zoom-in').onclick=()=>zoomAt(1.2);$('zoom-out').onclick=()=>zoomAt(1/1.2);$('reset-layout').onclick=()=>{layouts[mode]=JSON.parse(JSON.stringify(mode==='state'?D.layout.positions:D.requirementLayout.positions));focusStart();};const unfinished=D.phase==='incomplete'||!D.transitions.length||!D.requirements.length;$('analysis-warning').hidden=!unfinished;$('analysis-warning').textContent='状态迁移分析未完成：需补齐有来源的真实起点、迁移及对应原子需求；当前草稿不可作为完成交付。';$('summary').textContent=(unfinished?'需求分析未完成':'只读分析草案 · 图与需求同源')+' · '+D.starts.length+' 个真实起点';window.addEventListener('resize',resize);if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe($('header'));resize();renderTargets();focusStart();
</script></body></html>
