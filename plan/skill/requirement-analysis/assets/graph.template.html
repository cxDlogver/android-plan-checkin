<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="model-sha256" content="__MODEL_SHA__">
<title>状态迁移需求分析</title>
<style>
:root{font-family:system-ui,"Noto Sans SC",sans-serif;color:#172b3a;background:#f2f5f8;font-size:15px;line-height:1.65}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:1px solid #c3ced9;background:white;color:inherit;border-radius:7px;padding:6px 12px}button:hover,button:focus-visible{border-color:#226fd1;background:#edf4ff;outline:2px solid transparent}header{padding:19px 24px;background:#fff;border-bottom:1px solid #dce3eb}h1{font-size:23px;margin:0 0 4px}select{font:inherit;max-width:240px;padding:5px;border:1px solid #c3ced9;border-radius:6px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:21px 0 8px}p{margin:7px 0}code,pre{font-family:ui-monospace,monospace;font-size:12px}pre{background:#f2f5f9;padding:12px;overflow:auto;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#185ca3;overflow-wrap:anywhere}.muted{color:#596d7e}.status{display:inline-block;padding:2px 9px;border-radius:12px;background:#fff0cc;color:#765000;font-weight:600}.passed{background:#e1f4e9;color:#1a6543}.failed{background:#ffeaed;color:#a42c3b}.small{font-size:12px}.layout{display:grid;grid-template-columns:minmax(420px,1fr) 410px;height:calc(100vh - 103px);min-height:550px}.left{display:flex;min-height:0;flex-direction:column}.toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#f8fafc;flex-wrap:wrap}.toolbar span{margin-left:auto}.canvas-area{position:relative;flex:1;min-height:300px;background:#f7fafc;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.hint{position:absolute;left:14px;bottom:9px;padding:3px 8px;background:#ffffffde;border-radius:6px;pointer-events:none;font-size:12px;color:#64768a}.notice{padding:12px 18px;border-bottom:1px solid #dce3eb;background:#fff8e8;max-height:170px;overflow:auto}.notice strong{display:block}.list{display:flex;gap:6px;padding:10px 14px;max-height:132px;overflow:auto;flex-wrap:wrap;border-top:1px solid #dce3eb;background:#fff}.list button{font-size:12px;padding:4px 9px}.detail{background:#fff;border-left:1px solid #dce3eb;padding:22px;overflow:auto;overflow-wrap:anywhere}.lead{font-size:17px;font-weight:650;line-height:1.8}.fact{border-left:3px solid #81a7d0;padding:7px 12px;margin:12px 0;background:#f8fafc}.fact strong{font-size:16px}.fact img{width:100%;height:auto;max-height:600px;object-fit:contain;object-position:top;margin-top:10px;border:1px solid #dce3eb;background:#f2f5f8}.empty{color:#687d90;padding:12px 0}.source{font-size:12px;color:#63768a;margin:7px 0}.gwt{padding:12px 14px;border-radius:8px;background:#edf4fc;margin:13px 0}.gwt b{font-size:12px;color:#2363a0;display:block;letter-spacing:.03em}.gate{padding:9px 0;border-bottom:1px solid #e4eaf0}details{margin:14px 0}summary{cursor:pointer;font-weight:600}
@media(max-width:850px){.layout{display:flex;flex-direction:column;height:auto}.left{height:68vh;min-height:420px}.detail{border-left:0;border-top:1px solid #dce3eb;min-height:350px}header{padding:14px 16px}.toolbar span{display:none}}
</style>
</head>
<body>
<header><h1 id="title"></h1><div><span id="meta" class="muted small"></span></div></header>
<main class="layout">
<section class="left" aria-label="状态迁移图">
<div class="toolbar"><button id="fit">适应范围</button><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">－</button><button id="overview">全局约束</button><label class="small">聚焦状态 <select id="focusState" aria-label="聚焦某个状态及其到达路径"></select></label><span class="muted small">圆点标记初态 · 点击节点或连线看详情</span></div>

<div class="canvas-area"><canvas id="graph" aria-label="状态转移图"></canvas><div class="hint">拖动平移 · 滚轮缩放 · 下方列表也可键盘选择</div></div>
<nav id="entityList" class="list" aria-label="状态和迁移选择"></nav>
</section>
<aside id="detail" class="detail" aria-live="polite"></aside>
</main>
<script id="model" type="application/json">__MODEL_JSON__</script>
<script>
'use strict';
const model=JSON.parse(document.getElementById('model').textContent);
const byState=new Map(model.states.map(s=>[s.id,s]));
const graph=document.getElementById('graph'),ctx=graph.getContext('2d'),detail=document.getElementById('detail');
let scale=1,offsetX=30,offsetY=35,selected=null,drag=null,width=0,height=0,nodeBoxes=[],edgePaths=[],focusId="",visibleStates=model.states,visibleEdges=model.transitions;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pretty(v){return esc(JSON.stringify(v,null,2));}
function safePath(v){return /^[a-z][a-z0-9+.-]*:/i.test(v)||String(v).startsWith('//')?'#':esc(v);}
function sourceBlock(refs){return (refs||[]).map(s=>s.kind==='ui'?'<article class="fact"><p><a href="'+safePath(s.structurePath)+'" target="_blank" rel="noopener">UI结构：'+esc(s.documentId)+'</a><br><span class="small">节点：'+esc(s.nodeIds.join('、'))+'</span></p><a href="'+safePath(s.screenshotPath)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+safePath(s.screenshotPath)+'" alt="原截图 '+esc(s.documentId)+'"></a></article>':'<article class="source"><a href="'+safePath(s.path)+'" target="_blank" rel="noopener">'+esc(s.path)+'</a> · '+esc(s.locator)+(s.quote?'<p>'+esc(s.quote)+'</p>':'')+'</article>').join('');}
function observed(o){return '<p class="small muted">观察：'+esc(o.method)+' · '+esc(o.locator)+'</p>';}
function factBlock(f){return '<article class="fact"><strong>'+esc(f.statement)+'</strong>'+observed(f.observation)+'<details class="small"><summary>验收断言</summary><pre>'+pretty(f.assertion)+'</pre></details></article>';}
function selectState(id){const s=byState.get(id);if(!s)return;selected={type:'state',id};detail.innerHTML='<span class="muted small">状态 '+esc(s.id)+(s.isInitial?' · 起点':'')+'</span><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.statement)+'</p>'+(s.functionalFacts.length?'<h3>功能事实</h3>'+s.functionalFacts.map(factBlock).join(''):'')+(s.visualFacts.length?'<h3>视觉事实</h3>'+s.visualFacts.map(factBlock).join(''):'')+'<h3>直接来源</h3>'+sourceBlock(s.source);draw();}
function selectEdge(id){const e=model.transitions.find(e=>e.id===id);if(!e)return;selected={type:'edge',id};const from=byState.get(e.from),to=byState.get(e.to),op=e.operation;
detail.innerHTML='<span class="muted small">迁移 '+esc(e.id)+'</span><h2>'+esc(op.label)+'</h2><p class="lead">'+esc(from.title)+' → '+esc(to.title)+'</p><div class="gwt"><b>GIVEN · 初态</b>'+esc(from.statement)+'</div><div class="gwt"><b>WHEN · 动作</b>'+esc(op.actor)+'：'+esc(op.label)+'</div>'+(e.condition?'<div class="gwt"><b>事后分支条件</b>'+esc(e.condition.statement)+observed(e.condition.observation)+'</div>':'')+'<div class="gwt"><b>THEN · 终态</b>'+esc(to.statement)+'</div>'+(op.input?'<h3>动作输入</h3><pre>'+pretty(op.input)+'</pre>':'')+(e.condition?'<h3>分支结果样例</h3><pre>'+pretty(e.condition.sampleOutcome)+'</pre>':'')+(e.effects?'<h3>结果关系</h3>'+e.effects.map(f=>'<article class="fact"><strong>'+esc(f.statement)+'</strong><pre>'+pretty(f.assertion)+'</pre></article>').join(''):'')+'<h3>直接来源</h3>'+sourceBlock(e.source);draw();}
function showOverview(){selected=null;detail.innerHTML='<h2>全局约束</h2><p class="muted">以下规则对全部状态与迁移生效。</p>'+(model.constraints.length?model.constraints.map(c=>'<article class="fact"><strong>'+esc(c.statement)+'</strong>'+sourceBlock(c.source)+'</article>').join(''):'<p class="empty">无额外全局约束。</p>');draw();}
function buildLayout(){visibleStates=model.states;visibleEdges=model.transitions;if(focusId){const ids=new Set([focusId]),pending=[focusId];for(let i=0;i<pending.length;i++){for(const e of model.transitions.filter(e=>e.to===pending[i])){if(!ids.has(e.from)){ids.add(e.from);pending.push(e.from);}}}visibleStates=model.states.filter(s=>ids.has(s.id));visibleEdges=model.transitions.filter(e=>ids.has(e.from)&&ids.has(e.to));}const levels=new Map(),queue=[];for(const s of visibleStates.filter(s=>s.isInitial)){levels.set(s.id,0);queue.push(s.id);}for(let i=0;i<queue.length;i++){const id=queue[i];for(const e of visibleEdges.filter(e=>e.from===id)){if(!levels.has(e.to)){levels.set(e.to,levels.get(id)+1);queue.push(e.to);}}}const count=new Map();nodeBoxes=visibleStates.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(s=>{const l=levels.get(s.id)??0,r=count.get(l)||0;count.set(l,r+1);return {id:s.id,state:s,x:35+l*580,y:105+r*180,w:265,h:112};});}
function textLines(text,x,y,maxWidth,maxLines,font,lineHeight){ctx.font=font;let line='',lineNo=0;for(const char of String(text)){if(ctx.measureText(line+char).width>maxWidth&&line){ctx.fillText(line,x,y+lineNo*lineHeight);lineNo++;line='';if(lineNo>=maxLines){return;}}line+=char;}if(lineNo<maxLines)ctx.fillText(line,x,y+lineNo*lineHeight);}
function cubic(a,b,c,d,t){const u=1-t;return {x:u*u*u*a.x+3*u*u*t*b.x+3*u*t*t*c.x+t*t*t*d.x,y:u*u*u*a.y+3*u*u*t*b.y+3*u*t*t*c.y+t*t*t*d.y};}
function draw(){if(!width||!height)return;const ratio=window.devicePixelRatio||1;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,width,height);ctx.save();ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);edgePaths=[];const boxes=new Map(nodeBoxes.map(n=>[n.id,n]));for(const e of visibleEdges){const a=boxes.get(e.from),b=boxes.get(e.to);if(!a||!b)continue;const peers=visibleEdges.filter(x=>x.from===e.from&&x.to===e.to),order=peers.findIndex(x=>x.id===e.id),bend=(order-(peers.length-1)/2)*38;let p0,p1,p2,p3;if(a.id===b.id){p0={x:a.x+a.w,y:a.y+25};p1={x:a.x+a.w+125+order*52,y:a.y-65-order*120};p2={x:a.x+a.w+125+order*52,y:a.y+155};p3={x:a.x+a.w,y:a.y+85};}else if(b.x>a.x){p0={x:a.x+a.w,y:a.y+a.h/2};p3={x:b.x,y:b.y+b.h/2};p1={x:p0.x+55,y:p0.y+bend};p2={x:p3.x-55,y:p3.y+bend};}else{p0={x:a.x+a.w/2,y:a.y};p3={x:b.x+b.w/2,y:b.y};const top=Math.min(a.y,b.y)-55-bend;p1={x:p0.x,y:top};p2={x:p3.x,y:top};}const points=Array.from({length:41},(_,i)=>cubic(p0,p1,p2,p3,i/40));ctx.strokeStyle=selected?.type==='edge'&&selected.id===e.id?'#1769bc':'#8094aa';ctx.lineWidth=selected?.id===e.id?3:1.8;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(const p of points.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();const end=points.at(-1),prev=points.at(-3),angle=Math.atan2(end.y-prev.y,end.x-prev.x);ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(end.x,end.y);ctx.lineTo(end.x-11*Math.cos(angle-.45),end.y-11*Math.sin(angle-.45));ctx.lineTo(end.x-11*Math.cos(angle+.45),end.y-11*Math.sin(angle+.45));ctx.closePath();ctx.fill();const mid=points[20],op=e.operation,label=op.label+(e.condition?' / '+e.condition.statement:'');ctx.font='12px system-ui';const labelWidth=Math.min(255,ctx.measureText(label).width+12);ctx.fillStyle='#f7fafc';ctx.fillRect(mid.x-labelWidth/2,mid.y-20,labelWidth,21);ctx.fillStyle='#38516b';ctx.fillText(label.length>30?label.slice(0,29)+'…':label,mid.x-labelWidth/2+6,mid.y-5);edgePaths.push({id:e.id,points,label:{x:mid.x-labelWidth/2,y:mid.y-22,w:labelWidth,h:25}});}
for(const n of nodeBoxes){const active=selected?.type==='state'&&selected.id===n.id;ctx.fillStyle=active?'#eaf3ff':'#fff';ctx.strokeStyle=active?'#2274cd':'#c2cfdd';ctx.lineWidth=active?2.5:1.3;ctx.beginPath();ctx.roundRect(n.x,n.y,n.w,n.h,10);ctx.fill();ctx.stroke();ctx.fillStyle='#6885a0';ctx.font='11px system-ui';ctx.fillText(n.id,n.x+16,n.y+20);if(n.state.isInitial){ctx.fillStyle='#27775b';ctx.beginPath();ctx.arc(n.x+n.w-20,n.y+18,5,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#17344d';textLines(n.state.title,n.x+16,n.y+45,n.w-32,1,'600 16px system-ui',21);ctx.fillStyle='#526b82';textLines(n.state.statement,n.x+16,n.y+69,n.w-32,2,'13px system-ui',20);}
if(!nodeBoxes.length){ctx.fillStyle='#5d7288';ctx.font='600 20px system-ui';ctx.fillText('本范围无状态',20,70);ctx.font='14px system-ui';textLines('全局要求见右侧约束。',20,100,Math.max(260,(width-80)/scale),4,'14px system-ui',25);}ctx.restore();}
function resize(){const r=graph.getBoundingClientRect();width=r.width;height=r.height;const d=window.devicePixelRatio||1;graph.width=Math.round(width*d);graph.height=Math.round(height*d);draw();}
function fit(){if(!nodeBoxes.length){scale=1;offsetX=25;offsetY=20;draw();return;}const maxX=Math.max(...nodeBoxes.map(n=>n.x+n.w))+230,maxY=Math.max(...nodeBoxes.map(n=>n.y+n.h))+45;scale=Math.max(.55,Math.min(1.1,(width-40)/maxX,(height-40)/maxY));offsetX=25;offsetY=20;draw();}
function zoom(factor,x=width/2,y=height/2){const next=Math.max(.25,Math.min(2.8,scale*factor));const wx=(x-offsetX)/scale,wy=(y-offsetY)/scale;offsetX=x-wx*next;offsetY=y-wy*next;scale=next;draw();}
function dist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);}
function selectAt(x,y){const p={x:(x-offsetX)/scale,y:(y-offsetY)/scale};const n=nodeBoxes.find(n=>p.x>=n.x&&p.x<=n.x+n.w&&p.y>=n.y&&p.y<=n.y+n.h);if(n){selectState(n.id);return;}for(const e of edgePaths){const l=e.label;if(p.x>=l.x&&p.x<=l.x+l.w&&p.y>=l.y&&p.y<=l.y+l.h||e.points.slice(1).some((b,i)=>dist(p,e.points[i],b)<8/scale)){selectEdge(e.id);return;}}}
graph.addEventListener('pointerdown',e=>{graph.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY,moved:false};});
graph.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(drag.moved){offsetX=drag.ox+dx;offsetY=drag.oy+dy;draw();}});
graph.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const r=graph.getBoundingClientRect();selectAt(e.clientX-r.left,e.clientY-r.top);}drag=null;});
graph.addEventListener('pointercancel',()=>drag=null);
graph.addEventListener('wheel',e=>{e.preventDefault();const r=graph.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
function focusGraph(id){focusId=id||"";document.getElementById("focusState").value=focusId;buildLayout();fit();}
const focusControl=document.getElementById("focusState");focusControl.innerHTML='<option value="">全图</option>'+model.states.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.title)+'</option>').join('');focusControl.onchange=()=>{focusGraph(focusControl.value);if(focusId)selectState(focusId);};
document.getElementById('fit').onclick=fit;document.getElementById('zoomIn').onclick=()=>zoom(1.2);document.getElementById('zoomOut').onclick=()=>zoom(1/1.2);document.getElementById('overview').onclick=showOverview;
document.getElementById('title').textContent=model.title;document.title=model.title;
document.getElementById('meta').textContent='修订 '+model.revision+' · '+model.states.length+' 个状态 · '+model.transitions.length+' 条迁移 · '+model.constraints.length+' 项全局约束';
document.getElementById('entityList').innerHTML=model.states.map(s=>'<button data-state="'+esc(s.id)+'">'+esc(s.title)+'</button>').join('')+model.transitions.map(e=>'<button data-edge="'+esc(e.id)+'">'+esc(e.id)+' · '+esc(e.operation.label)+'</button>').join('');
document.getElementById('entityList').addEventListener('click',e=>{if(e.target.dataset.state){focusGraph(e.target.dataset.state);selectState(e.target.dataset.state);}if(e.target.dataset.edge){const edge=model.transitions.find(x=>x.id===e.target.dataset.edge);focusGraph(edge.to);selectEdge(edge.id);}});
buildLayout();showOverview();new ResizeObserver(resize).observe(graph.parentElement);resize();fit();if(model.states.length>8){focusGraph(model.states.find(s=>!s.isInitial)?.id||model.states[0].id);selectState(focusId);}
</script>
</body>
</html>
