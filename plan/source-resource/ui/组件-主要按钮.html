<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC%3Awght%40100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="组件／主要按钮"
      style="align-items: center; background-image: linear-gradient(180deg, #FFFFFF 0%, #D4DAE0 15%, #EEF2F5 40%, #FFFFFF 44%, #D7DFE6 48%, #B9C4CE 100%); background-repeat: no-repeat; background-size: 100% 100%; border-radius: 2px; box-shadow: 0px 2px 4px #15273733, inset 0px 1px 0px #FFFFFF, inset 0px -1px 0px #8293A033; box-sizing: border-box; display: flex; flex-direction: row; gap: 0px; height: 48px; justify-content: center; outline-offset: -0.5px; outline: 1px solid #92A1AE; width: 353px"
    >
      <div
        data-pencil-name="主按钮文字"
        style='box-sizing: border-box; color: #17212B; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 15px; font-style: normal; font-weight: 700; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap'
      >
        保存
      </div>
    </div>
  </body>
</html>
