fdbd1199c1088974f9281190ecac8ffed87f5a98fbd7c74c5652"},{"documentId":"ui-YbZvd","kind":"ui","nodeIds":["n-YbZvd"],"screenshotPath":"../source-resource/ui/组件-主要按钮.png","screenshotSha256":"9fbf409d1283a4d314807283f46546e648492a8a598b4f33ab1649f176ce1617","structurePath":"../ui-spec/documents/组件-主要按钮.json","structureSha256":"7f3a76d91a18400fc8d2b37173ad596d4908c3c16e3e9a72b7b98a47f8817d11"},{"kind":"document","locator":"L45-L51","path":"../source-resource/prd/设计还原需求文档.md","quote":"### 1.2 数据展示与对齐\n\n示例数据不要求等于UI设计稿中的具体值。名称、用户输入、日期、时间、计数、统计比例及版本号等在UI JSON中使用动态占位，固定标签、按钮、状态语义和说明文案继续按JSON对齐。占位字段声明类型、显示格式及固定句式，不保存原图示例值作为默认值。\n\n视觉预期由当前JSON与本次明确传入的场景数据共同确定；实际界面使用同一输入，核对解析后的格式、文字流、图形比例、结构及外观。数据可以改变换行和内容高度，不能为贴合原稿的示例宽度裁剪或缩小字号。缺少必需数据时，不能以原稿值或未解析占位符代替。\n\n浏览同一对象时，按场景传入同一份数据或明确字段映射；设计稿中不同的示例名称或日期不作为固定前提，不据此要求页面切换后加载不一致的样例。此要求只约束UI展示输入，不扩大存储、统计或跨日等功能验收范围。","sha256":"59323589edca8e6583e91a6b54f60ff9241ba016a57f90bc63430f817cfe77ab"},{"kind":"document","locator":"$","path":"../ui-spec/UI规范.md","sha256":"e360fd35ea24b35056cdf8e00fcce62c1efa8ee70f2c5a8c2c25dedf7d268ff5"}],"statement":"全部画面按结构JSON、固定文案、动态占位及library解析后的视觉配方验收；动态值由本次场景输入解析后对照。组件在页面实例中覆盖，PNG只展示来源。"},{"id":"G-layout","source":[{"kind":"document","locator":"L71-L78","path":"../source-resource/prd/设计还原需求文档.md","quote":"- 23个页面的逻辑宽度均为393，按768断点归mobile；常规参考高度852，长画板保留其referenceSize。未提供desktop，不新增运行平台字段。\n- 一维容器使用Flex；日历星期与日期分别使用七列Grid。页面布局采用flow，每个容器只有一种确定结构。\n- mobile画布宽度填充可用区域，上限480并居中；320为本版计划验证下限。W>=768选择desktop，而本次设计尚未提供该类页面。\n- 页面主内容为唯一业务纵向滚动区；页头和已有底导航位于其外。\n- 文字可随系统字号放大并换行，容器可增高；具体短文本单行、固定图标、等权和比例策略以节点JSON为准。\n- 环境区域和键盘按宿主实际insets处理一次；JSON中的环境托管样例不由业务重复绘制。\n\n具体节点规则与取值只维护在JSON中，本需求文档不再复制另一套色值、字号或页面结构表。","sha256":"59323589edca8e6583e91a6b54f60ff9241ba016a57f90bc63430f817cfe77ab"},{"kind":"document","locator":"L87-L89","path":"../source-resource/prd/设计还原需求文档.md","quote":"| A04 尺寸 | 按fixed/content/fill/fraction/percent/viewport执行，不能整体缩放页面或用图片像素当逻辑尺寸 |\n| A05 适配 | 按rules矩阵检查窗口、长文案、字号和键盘，无业务横向溢出或关键内容裁剪 |\n| A06 平台区域 | 安全区只处理一次，平台样例不由业务页面重复绘制 |","sha256":"59323589edca8e6583e91a6b54f60ff9241ba016a57f90bc63430f817cfe77ab"},{"kind":"document","locator":"$","path":"../ui-spec/rules.json","sha256":"a61907f7416d59485c6d1648ed2c9796976160e77663704ca79a362559a20367"}],"statement":"所有画面统一执行rules及节点JSON中确定的端型分类、唯一布局、尺寸策略、滚动、换行、字体缩放与环境避让规则；适配矩阵中的窗口、文案、字号、键盘输入按该规则验收，不单独建立画面状态。"},{"id":"G-scope","source":[{"kind":"document","locator":"L16","path":"../source-resource/prd/设计还原需求文档.md","quote":"本轮仍只有UI设计还原这一项需求。页面状态、固定说明及数据展示用于视觉对照，不据此增加数据存储、统计、业务路由、跨日处理等业务完成条件。","sha256":"59323589edca8e6583e91a6b54f60ff9241ba016a57f90bc63430f817cfe77ab"},{"kind":"document","locator":"L20-L22","path":"../source-resource/prd/设计还原需求文档.md","quote":"从今日页进入，按现有控件建立纯UI浏览流程。点击、选择和返回用于切换视觉画面；验收动作前后的界面事实，不验收存储、统计等功能效果。页面进入和返回属于本轮视觉浏览要求，不能因不实现业务功能而省略。\n\n页面所含的保存、删除、暂停、跨日等说明仍是需要还原的可见文案。显示相应画面不代表已经执行文案描述的业务效果。","sha256":"59323589edca8e6583e91a6b54f60ff9241ba016a57f90bc63430f817cfe77ab"},{"kind":"document","locator":"L26","path":"../source-resource/prd/设计还原需求文档.md","quote":"本轮只连接已提供的JSON画面。选择类型可以切换既有的新建表单；名称、日期、备注、计数等动态值由场景输入。没有对应JSON的筛选展开、其他月份、其他选中结果、校验提示及功能完成画面，不补充为本轮新增设计；相关控件仍验收当前画面中的外观。自由输入和数量变化按已有动态绑定与适配规则检查。","sha256":"59323589edca8e6583e91a6b54f60ff9241ba016a57f90bc63430f817cfe77ab"},{"kind":"document","locator":"L43","path":"../source-resource/prd/设计还原需求文档.md","quote":"要做表单的保存只模拟UI响应：ordinary-return、not-saved、date-changed三种结果在动作后区分，响应值由验收场景提供，不代表本机存储或日期算法已实现。重试只纳入普通返回路径，不另补未要求的重复异常结果。其他确定的浏览动作不增加条件。","sha256":"59323589edca8e6583e91a6b54f60ff9241ba016a57f90bc63430f817cfe77ab"}],"statement":"图中操作只验收已有UI画面的呈现与切换；画面上的保存、删除、暂停、统计、跨日、离线等文案不构成实际功能完成事实，存储、统计和相应业务处理效果不在本轮验收范围。"},{"id":"G-evidence","source":[{"kind":"document","locator":"L90","path":"../source-resource/prd/设计还原需求文档.md","quote":"| A07 证据 | 记录JSON版本、页面与节点ID、实际环境、本次输入数据、截图及差异结果 |","sha256":"59323589edca8e6583e91a6b54f60ff9241ba016a57f90bc63430f817cfe77ab"},{"kind":"document","locator":"L93","path":"../source-resource/prd/设计还原需求文档.md","quote":"JSON结构校验通过不代表实际应用视觉验收通过。像素相 <script>
'use strict';
const artifact=JSON.parse(document.getElementById('model').textContent);
const isAtomic=Array.isArray(artifact.requirements);
const stateModel=isAtomic?JSON.parse(document.getElementById('stateModel').textContent):artifact;
const businessStates=new Map(stateModel.states.map(s=>[s.id,s]));
const businessTransitions=new Map(stateModel.transitions.map(t=>[t.id,t]));
const requirementsById=new Map((artifact.requirements||[]).map(r=>[r.id,r]));
const words=isAtomic?{node:'原子需求',edge:'路线边',nodes:'个原子需求',edges:'条路线边'}:{node:'状态',edge:'迁移',nodes:'个状态',edges:'条迁移'};
// This is a view projection. Facts, operations and sources are read from the embedded state graph.
const model=isAtomic?{title:artifact.title,revision:artifact.revision,constraints:stateModel.constraints,
  states:artifact.requirements.map(r=>{const t=businessTransitions.get(r.transitionId),from=businessStates.get(t.from),to=businessStates.get(t.to);return {id:r.id,title:t.operation.label+(t.condition?' / '+t.condition.statement:''),statement:from.title+' → '+to.title,isInitial:from.isInitial};}),
  transitions:artifact.edges.map(e=>({id:e.id,from:e.from,to:e.to,restart:e.kind==='restart',operation:{label:e.kind==='restart'?'重新进入起点 '+e.to:'经 '+e.viaStateId+' · '+businessStates.get(e.viaStateId).title}}))}:artifact;

const byState=new Map(model.states.map(s=>[s.id,s]));
const graph=document.getElementById('graph'),ctx=graph.getContext('2d'),detail=document.getElementById('detail');
let scale=1,offsetX=30,offsetY=35,selected=null,drag=null,width=0,height=0,nodeBoxes=[],allNodeBoxes=[],edgePaths=[],focusId="",visibleStates=model.states,visibleEdges=model.transitions;
const edgeAdjustments=new Map();
let allEdgeGeometry=null,selectedArrivalIndex=-1;
const routeEdgeByPair=new Map((artifact.edges||[]).map(e=>[JSON.stringify([e.from,e.to]),e]));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pretty(v){return esc(JSON.stringify(v,null,2));}
function safePath(v){const raw=String(v??'');if(/^[a-z][a-z0-9+.-]*:/i.test(raw)||raw.startsWith('//'))return '#';const base=isAtomic?artifact.stateGraph.path.replace(/[^/]*$/,''):'';return esc(base+raw);}
function sourceBlock(refs){return (refs||[]).map(s=>s.kind==='ui'?'<article class="fact"><p><a href="'+safePath(s.structurePath)+'" target="_blank" rel="noopener">UI结构：'+esc(s.documentId)+'</a><br><span class="small">节点：'+esc(s.nodeIds.join('、'))+'</span></p><a href="'+safePath(s.screenshotPath)+'" target="_blank" rel="noopener"><img loading="eager" src="'+safePath(s.screenshotPath)+'" alt="原截图 '+esc(s.documentId)+'"></a><p class="small muted">原截图用于定位来源；动态数据按JSON绑定与场景输入验收。</p></article>':'<article class="source"><a href="'+safePath(s.path)+'" target="_blank" rel="noopener">'+esc(s.path)+'</a> · '+esc(s.locator)+(s.quote?'<p>'+esc(s.quote)+'</p>':'')+'</article>').join('');}
function observed(o){return '<p class="small muted">观察：'+esc(o.method)+' · '+esc(o.locator)+'</p>';}
function factBlock(f){return '<article class="fact"><strong>'+esc(f.statement)+'</strong>'+observed(f.observation)+'<details class="small"><summary>验收断言</summary><pre>'+pretty(f.assertion)+'</pre></details></article>';}
function stateFacts(s){return '<h3>'+esc(s.id)+' · '+esc(s.title)+'</h3><p class="lead">'+esc(s.statement)+'</p>'+(s.visualFacts.length?'<h3>视觉事实</h3>'+s.visualFacts.map(factBlock).join(''):'')+(s.source.some(x=>x.kind==='ui')?'<h3>UI结构与原截图</h3>'+sourceBlock(s.source.filter(x=>x.kind==='ui')):'')+(s.functionalFacts.length?'<h3>功能事实</h3>'+s.functionalFacts.map(factBlock).join(''):'')+'<h3>直接来源</h3>'+sourceBlock(s.source.filter(x=>x.kind!=='ui'));}
function operationExtras(t){return (t.operation.input?'<h3>动作输入</h3><pre>'+pretty(t.operation.input)+'</pre>':'')+(t.condition?'<h3>分支结果样例</h3><pre>'+pretty(t.condition.sampleOutcome)+'</pre>':'')+(t.effects?'<h3>结果关系</h3>'+t.effects.map(f=>'<article class="fact"><strong>'+esc(f.statement)+'</strong><pre>'+pretty(f.assertion)+'</pre></article>').join(''):'');}
function arrivalPath(id){
  if(!isAtomic)return null;const sequence=artifact.coverage.sequence;
  const end=selectedArrivalIndex>=0&&sequence[selectedArrivalIndex]===id?selectedArrivalIndex:sequence.indexOf(id);if(end<0)return {ids:[],edges:[],start:0,end:-1};
  let start=0;for(let i=end;i>=0;i--)if(byState.get(sequence[i])?.isInitial){start=i;break;}
  const ids=sequence.slice(start,end+1),edges=[];for(let i=1;i<ids.length;i++){const edge=routeEdgeByPair.get(JSON.stringify([ids[i-1],ids[i]]));if(edge)edges.push(edge.id);}
  return {ids,edges,start,end};
}
function arrivalPathHTML(id){
  const route=arrivalPath(id),sequence=artifact.coverage.sequence,occurrences=sequence.flatMap((value,index)=>value===id?[index]:[]);
  return '<section class="arrival-path"><h3>到达路径</h3><p class="small muted">最优覆盖共 '+artifact.coverage.visitCount+' 次需求访问；当前显示本段起始需求至覆盖序列第 '+(route.end+1)+' 步的路径。</p>'+(occurrences.length>1?'<label class="small">到达次数 <select id="arrivalOccurrence" aria-label="选择当前需求的到达次数">'+occurrences.map((index,k)=>'<option value="'+index+'"'+(index===route.end?' selected':'')+'>第 '+(k+1)+' 次 · 总序列第 '+(index+1)+' 步</option>').join('')+'</select></label>':'')+'<ol>'+route.ids.map((value,k)=>{const req=requirementsById.get(value),t=businessTransitions.get(req.transitionId);return '<li'+(k===route.ids.length-1?' class="current"':'')+'><strong>'+esc(value)+'</strong> · '+esc(t.operation.label)+(t.condition?' / '+esc(t.condition.statement):'')+'<span class="small muted">（总序列第 '+(route.start+k+1)+' 步）</span></li>';}).join('')+'</ol></section>';
}
function bindArrivalSelector(id){const control=document.getElementById('arrivalOccurrence');if(control)control.onchange=e=>{const index=Number(e.target.value);if(artifact.coverage.sequence[index]!==id)return;selectedArrivalIndex=index;focusGraph(id);selectRequirement(id);};}
function selectRequirement(id){const r=requirementsById.get(id);if(!r)return;if(artifact.coverage.sequence[selectedArrivalIndex]!==id)selectedArrivalIndex=artifact.coverage.sequence.indexOf(id);const t=businessTransitions.get(r.transitionId),from=businessStates.get(t.from),to=businessStates.get(t.to);selected={type:'state',id};detail.innerHTML='<span class="muted small">原子需求 '+esc(r.id)+' · 迁移 '+esc(t.id)+(from.isInitial?' · 起点':'')+'</span><h2>'+esc(t.operation.label)+'</h2>'+arrivalPathHTML(id)+'<p class="lead">'+esc(from.title)+' → '+esc(to.title)+'</p><div class="gwt"><b>GIVEN · 初态</b>'+esc(from.statement)+'</div>'+stateFacts(from)+'<div class="gwt"><b>WHEN · 动作</b>'+esc(t.operation.actor)+'：'+esc(t.operation.label)+'</div>'+(t.condition?'<div class="gwt"><b>事后分支条件</b>'+esc(t.condition.statement)+observed(t.condition.observation)+'</div>':'')+'<div class="gwt"><b>THEN · 终态</b>'+esc(to.statement)+'</div>'+stateFacts(to)+operationExtras(t);bindArrivalSelector(id);draw();}
function selectHandoff(id){const e=artifact.edges.find(e=>e.id===id);if(!e)return;const a=requirementsById.get(e.from),b=requirementsById.get(e.to),ta=businessTransitions.get(a.transitionId),tb=businessTransitions.get(b.transitionId);selected={type:'edge',id};detail.innerHTML='<span class="muted small">路线边 '+esc(e.id)+'</span><h2>'+esc(e.from)+' → '+esc(e.to)+'</h2><p class="lead">'+esc(ta.operation.label)+' → '+esc(tb.operation.label)+'</p>'+(e.kind==='restart'?'<div class="gwt"><b>重新进入起始需求</b>'+esc(e.to)+'</div><p>当前段结束后，按已授权的起点准备方式重新进入 '+esc(tb.from)+'，再执行 '+esc(e.to)+'。该连接只表达覆盖路线的重入。</p>'+stateFacts(businessStates.get(tb.from)):'<div class="gwt"><b>前项终态 = 后项初态</b>'+esc(e.viaStateId)+' · '+esc(businessStates.get(e.viaStateId).title)+'</div>'+stateFacts(businessStates.get(e.viaStateId)));draw();}
function selectState(id){if(isAtomic){selectRequirement(id);return;}const s=byState.get(id);if(!s)return;selected={type:'state',id};detail.innerHTML='<span class="muted small">状态 '+esc(s.id)+(s.isInitial?' · 起点':'')+'</span><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.statement)+'</p>'+(s.visualFacts.length?'<h3>视觉事实</h3>'+s.visualFacts.map(factBlock).join(''):'')+(s.source.some(x=>x.kind==='ui')?'<h3>UI结构与原截图</h3>'+sourceBlock(s.source.filter(x=>x.kind==='ui')):'')+(s.functionalFacts.length?'<h3>功能事实</h3>'+s.functionalFacts.map(factBlock).join(''):'')+'<h3>直接来源</h3>'+sourceBlock(s.source.filter(x=>x.kind!=='ui'));draw();}

function showOverview(){selected=null;detail.innerHTML='<h2>全局约束</h2><p class="muted">'+(isAtomic?'以下规则沿用来源状态图，对全部原子需求生效。':'以下规则对全部状态与迁移生效。')+'</p>'+(model.constraints.length?model.constraints.map(c=>'<article class="fact"><strong>'+esc(c.statement)+'</strong>'+sourceBlock(c.source)+'</article>').join(''):'<p class="empty">无额外全局约束。</p>');draw();}
// Multi-source BFS assigns the minimum number of transitions from any initial state.
// Focus filters this complete layout; only resetLayout explicitly rebuilds coordinates.
function buildLayout(){
  allEdgeGeometry=null;
  const levels=new Map(),queue=[],outgoing=new Map(model.states.map(s=>[s.id,[]]));
  for(const e of model.transitions)outgoing.get(e.from)?.push(e.to);
  for(const s of model.states)if(s.isInitial){levels.set(s.id,0);queue.push(s.id);}
  for(let i=0;i<queue.length;i++)for(const id of outgoing.get(queue[i])||[])if(!levels.has(id)){levels.set(id,levels.get(queue[i])+1);queue.push(id);}
  const count=new Map();
  allNodeBoxes=model.states.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(state=>{
    const level=levels.get(state.id)??0,row=count.get(level)||0;count.set(level,row+1);
    return {id:state.id,state,level,x:35+level*500,y:80+row*170,w:285,h:124};
  });
  updateVisibility();
}
function updateVisibility(){
  const route=isAtomic&&focusId?arrivalPath(focusId):null;
  const ids=route?new Set(route.ids):focusId?new Set([focusId,...model.transitions.filter(e=>e.from===focusId||e.to===focusId).flatMap(e=>[e.from,e.to])]):new Set(model.states.map(s=>s.id));
  visibleStates=model.states.filter(s=>ids.has(s.id));
  const routeEdges=route?new Set(route.edges):null;
  visibleEdges=route?model.transitions.filter(e=>routeEdges.has(e.id)):focusId?model.transitions.filter(e=>e.from===focusId||e.to===focusId):model.transitions;
  nodeBoxes=allNodeBoxes.filter(n=>ids.has(n.id));
}
function textLines(text,x,y,maxWidth,maxLines,font,lineHeight){ctx.font=font;let line='',lineNo=0;for(const char of String(text)){if(ctx.measureText(line+char).width>maxWidth&&line){ctx.fillText(line,x,y+lineNo*lineHeight);lineNo++;line='';if(lineNo>=maxLines)return;}line+=char;}if(lineNo<maxLines)ctx.fillText(line,x,y+lineNo*lineHeight);}
function cubic(a,b,c,d,t){const u=1-t;return {x:u*u*u*a.x+3*u*u*t*b.x+3*u*t*t*c.x+t*t*t*d.x,y:u*u*u*a.y+3*u*u*t*b.y+3*u*t*t*c.y+t*t*t*d.y};}
function intersects(a,b,pad=0){return a.x<b.x+b.w+pad&&a.x+a.w>b.x-pad&&a.y<b.y+b.h+pad&&a.y+a.h>b.y-pad;}
function obstacleIndex(){
  const cells=new Map();
  function visit(box,callback){for(let x=Math.floor(box.x/256);x<=Math.floor((box.x+box.w)/256);x++)for(let y=Math.floor(box.y/128);y<=Math.floor((box.y+box.h)/128);y++)if(callback(x+':'+y))return true;return false;}
  return {add(box,pad){const expanded={x:box.x-pad,y:box.y-pad,w:box.w+pad*2,h:box.h+pad*2};visit(expanded,key=>{if(!cells.has(key))cells.set(key,[]);cells.get(key).push(expanded);return false;});},overlaps(box){return visit(box,key=>(cells.get(key)||[]).some(other=>intersects(box,other)));}};
}
function placeEdgeLabel(points,labelWidth,used){
  for(const radius of [0,28,56,84,112,140])for(const index of [20,16,24,12,28])for(const dx of radius?[0,-radius,radius]:[0])for(const dy of radius?[-radius,radius,0]:[0]){
    const p=points[index],box={x:p.x-labelWidth/2+dx,y:p.y-22+dy,w:labelWidth,h:25};
    if(used.overlaps(box))continue;
    return {...box,anchor:p};
  }
  const p=points[20];return {x:p.x-labelWidth/2,y:p.y-22,w:labelWidth,h:25,anchor:p};
}
function edgeGeometry(e,boxes){
  const a=boxes.get(e.from),b=boxes.get(e.to);if(!a||!b)return null;
  // Use full-model peers so filtering never changes the route of a visible edge.
  const peers=model.transitions.filter(x=>x.from===e.from&&x.to===e.to),order=peers.findIndex(x=>x.id===e.id),bend=(order-(peers.length-1)/2)*38;
  let p0,p1,p2,p3;
  if(a.id===b.id){p0={x:a.x+a.w,y:a.y+25};p1={x:a.x+a.w+125+order*52,y:a.y-65-order*120};p2={x:a.x+a.w+125+order*52,y:a.y+155};p3={x:a.x+a.w,y:a.y+85};}
  else if(b.x>a.x){p0={x:a.x+a.w,y:a.y+a.h/2};p3={x:b.x,y:b.y+b.h/2};p1={x:p0.x+55,y:p0.y+bend};p2={x:p3.x-55,y:p3.y+bend};}
  else{p0={x:a.x+a.w/2,y:a.y};p3={x:b.x+b.w/2,y:b.y};const top=Math.min(a.y,b.y)-55-bend;p1={x:p0.x,y:top};p2={x:p3.x,y:top};}
  const adjustment=edgeAdjustments.get(e.id)||{dx:0,dy:0};
  p1={x:p1.x+adjustment.dx,y:p1.y+adjustment.dy};p2={x:p2.x+adjustment.dx,y:p2.y+adjustment.dy};
  return Array.from({length:41},(_,i)=>cubic(p0,p1,p2,p3,i/40));
}
function paintEdge(e,active){
  ctx.strokeStyle=active?'#1769bc':e.restart?'#a66a20':'#8094aa';ctx.lineWidth=active?3:1.8;ctx.setLineDash(e.restart?[7,5]:[]);
  ctx.beginPath();ctx.moveTo(e.points[0].x,e.points[0].y);for(const p of e.points.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();ctx.setLineDash([]);
  const end=e.points.at(-1),prev=e.points.at(-3),angle=Math.atan2(end.y-prev.y,end.x-prev.x);
  ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(end.x,end.y);ctx.lineTo(end.x-11*Math.cos(angle-.45),end.y-11*Math.sin(angle-.45));ctx.lineTo(end.x-11*Math.cos(angle+.45),end.y-11*Math.sin(angle+.45));ctx.closePath();ctx.fill();
  const box=e.label,anchor=box.anchor;
  if(Math.hypot(box.x+box.w/2-anchor.x,box.y+box.h/2-anchor.y)>30){ctx.strokeStyle=active?'#1769bc':'#bdcad6';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(anchor.x,anchor.y);ctx.lineTo(box.x+box.w/2,box.y+box.h/2);ctx.stroke();}
  ctx.fillStyle=active?'#e4effd':'#f7fafc';ctx.fillRect(box.x,box.y,box.w,box.h);ctx.fillStyle=active?'#145a9f':'#38516b';ctx.font='12px system-ui';ctx.fillText(e.text,box.x+6,box.y+17);
}
function draw(){
  if(!width||!height)return;
  const ratio=window.devicePixelRatio||1;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,width,height);ctx.save();ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);
  // Compute labels from the whole layout, then filter. Focus never moves nodes, curves or labels.
  const visibleIds=new Set(visibleEdges.map(e=>e.id));
  if(!allEdgeGeometry){
  const boxes=new Map(allNodeBoxes.map(n=>[n.id,n])),used=obstacleIndex(),paths=[];
  for(const n of allNodeBoxes)used.add(n,5);
  for(const e of model.transitions){
    const points=edgeGeometry(e,boxes);if(!points)continue;
    const fullLabel=e.id+' '+e.operation.label+(e.condition?' / '+e.condition.statement:'');ctx.font='12px system-ui';let label=fullLabel;
    while(ctx.measureText(label).width>235&&label.length>1)label=label.slice(0,-2)+'…';
    const box=placeEdgeLabel(points,ctx.measureText(label).width+12,used);used.add(box,4);paths.push({id:e.id,points,label:box,text:label,restart:!!e.restart});
  }
  allEdgeGeometry=paths;
  }
  edgePaths=allEdgeGeometry.filter(e=>visibleIds.has(e.id));
  const activeEdge=selected?.type==='edge'?edgePaths.find(e=>e.id===selected.id):null;
  for(const e of edgePaths)if(e!==activeEdge)paintEdge(e,false);
  for(const n of nodeBoxes){
    const active=selected?.type==='state'&&selected.id===n.id;ctx.fillStyle=active?'#eaf3ff':'#fff';ctx.strokeStyle=active?'#2274cd':'#c2cfdd';ctx.lineWidth=active?2.5:1.3;
    ctx.beginPath();ctx.roundRect(n.x,n.y,n.w,n.h,10);ctx.fill();ctx.stroke();ctx.fillStyle='#6885a0';ctx.font='11px system-ui';ctx.fillText(n.id,n.x+16,n.y+20);
    if(n.state.isInitial){ctx.fillStyle='#27775b';ctx.beginPath();ctx.arc(n.x+n.w-20,n.y+18,5,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#17344d';textLines(n.state.title,n.x+16,n.y+45,n.w-32,2,'600 16px system-ui',21);ctx.fillStyle='#526b82';textLines(n.state.statement,n.x+16,n.y+95,n.w-32,1,'13px system-ui',20);
  }

  if(activeEdge)paintEdge(activeEdge,true);
  if(!nodeBoxes.length){ctx.fillStyle='#5d7288';ctx.font='600 20px system-ui';ctx.fillText('本范围无'+words.node,20,70);textLines('全局要求见右侧约束。',20,100,Math.max(260,(width-80)/scale),4,'14px system-ui',25);}
  ctx.restore();
}
function resize(){const r=graph.getBoundingClientRect();width=r.width;height=r.height;const d=window.devicePixelRatio||1;graph.width=Math.round(width*d);graph.height=Math.round(height*d);draw();}
function fit(){
  if(!nodeBoxes.length){scale=1;offsetX=25;offsetY=20;draw();return;}
  const minX=Math.min(...nodeBoxes.map(n=>n.x),...edgePaths.flatMap(e=>[e.label.x,...e.points.map(p=>p.x)]))-25;
  const minY=Math.min(...nodeBoxes.map(n=>n.y),...edgePaths.flatMap(e=>[e.label.y,...e.points.map(p=>p.y)]))-25;
  const maxX=Math.max(...nodeBoxes.map(n=>n.x+n.w),...edgePaths.flatMap(e=>[e.label.x+e.label.w,...e.points.map(p=>p.x)]))+25;
  const maxY=Math.max(...nodeBoxes.map(n=>n.y+n.h),...edgePaths.flatMap(e=>[e.label.y+e.label.h,...e.points.map(p=>p.y)]))+25;
  scale=Math.min(1.1,(width-40)/(maxX-minX),(height-40)/(maxY-minY));offsetX=(width-(maxX-minX)*scale)/2-minX*scale;offsetY=(height-(maxY-minY)*scale)/2-minY*scale;draw();
}
function zoom(factor,x=width/2,y=height/2){const next=Math.max(.04,Math.min(2.8,scale*factor)),wx=(x-offsetX)/scale,wy=(y-offsetY)/scale;offsetX=x-wx*next;offsetY=y-wy*next;scale=next;draw();}
function dist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);}
function edgeContains(e,p){const l=e.label;return p.x>=l.x&&p.x<=l.x+l.w&&p.y>=l.y&&p.y<=l.y+l.h||e.points.slice(1).some((b,i)=>dist(p,e.points[i],b)<Math.min(14,7/scale));}
function hitTest(x,y){
  const p={x:(x-offsetX)/scale,y:(y-offsetY)/scale};
  const active=selected?.type==='edge'?edgePaths.find(e=>e.id===selected.id):null;
  if(active&&edgeContains(active,p))return {type:'edge',id:active.id};
  const n=nodeBoxes.slice().reverse().find(n=>p.x>=n.x&&p.x<=n.x+n.w&&p.y>=n.y&&p.y<=n.y+n.h);if(n)return {type:'state',id:n.id};
  const e=edgePaths.slice().reverse().find(e=>e!==active&&edgeContains(e,p));return e?{type:'edge',id:e.id}:null;
}
function focusGraph(id){focusId=byState.has(id)?id:'';if(isAtomic&&focusId&&artifact.coverage.sequence[selectedArrivalIndex]!==focusId)selectedArrivalIndex=artifact.coverage.sequence.indexOf(focusId);document.getElementById('focusState').value=focusId;updateVisibility();if(selected&&!nodeBoxes.some(n=>selected.type==='state'&&n.id===selected.id)&&!visibleEdges.some(e=>selected.type==='edge'&&e.id===selected.id))selected=null;draw();}
function activateState(id){if(isAtomic&&focusId!==id)selectedArrivalIndex=artifact.coverage.sequence.indexOf(id);focusGraph(focusId===id?'':id);selectState(id);}
function activate(hit){if(hit?.type==='state')activateState(hit.id);else if(hit?.type==='edge')selectEdge(hit.id);}
function selectAt(x,y){activate(hitTest(x,y));}
function pointerPosition(e){const r=graph.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
graph.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;graph.setPointerCapture(e.pointerId);graph.focus();const p=pointerPosition(e),hit=hitTest(p.x,p.y);
  const node=hit?.type==='state'?allNodeBoxes.find(n=>n.id===hit.id):null,adjustment=edgeAdjustments.get(hit?.id)||{dx:0,dy:0};
  drag={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY,scale,hit,node,nx:node?.x,ny:node?.y,dx:adjustment.dx,dy:adjustment.dy,moved:false};
  if(hit?.type==='edge')selectEdge(hit.id);

graph.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(!drag.moved)return;
  if(drag.node){drag.node.x=drag.nx+dx/drag.scale;drag.node.y=drag.ny+dy/drag.scale;}
  else if(drag.hit?.type==='edge')edgeAdjustments.set(drag.hit.id,{dx:drag.dx+dx/drag.scale,dy:drag.dy+dy/drag.scale});
  else{offsetX=drag.ox+dx;offsetY=drag.oy+dy;}if(drag.hit)allEdgeGeometry=null;draw();
});
graph.addEventListener('pointerup',()=>{if(drag&&!drag.moved)activate(drag.hit);drag=null;});
graph.addEventListener('pointercancel',()=>drag=null);
graph.addEventListener('lostpointercapture',()=>drag=null);
graph.addEventListener('wheel',e=>{e.preventDefault();if(drag)return;const p=pointerPosition(e);zoom(e.deltaY<0?1.12:1/1.12,p.x,p.y);},{passive:false});
graph.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();focusGraph('');return;}
  if(e.key==='Enter'){e.preventDefault();activate(selected);return;}
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();
  const type=e.shiftKey?'edge':'state',items=type==='edge'?visibleEdges:visibleStates;if(!items.length)return;

function toggleSidebar(){

  const button=document.getElementById('toggleSidebar'),label=collapsed?'展开详情':'收起详情';
  button.setAttribute('aria-expanded',String(!collapsed));button.setAttribute('aria-label',label+'侧栏');button.setAttribute('title',label+'侧栏');

  document.getElementById('sidebarToggleText').textContent=label;resize();
}
function resetLayout(){selectedArrivalIndex=-1;edgeAdjustments.clear();focusId='';document.getElementById('focusState').value='';buildLayout();draw();fit();}
const focusControl=document.getElementById('focusState');focusControl.innerHTML='<option value="">全图</option>'+model.states.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.title)+'</option>').join('');focusControl.onchange=()=>{if(isAtomic)selectedArrivalIndex=artifact.coverage.sequence.indexOf(focusControl.value);focusGraph(focusControl.value);if(focusId)selectState(focusId);};
document.getElementById('fit').onclick=fit;document.getElementById('zoomIn').onclick=()=>zoom(1.2);document.getElementById('zoomOut').onclick=()=>zoom(1/1.2);document.getElementById('overview').onclick=showOverview;document.getElementById('toggleSidebar').onclick=toggleSidebar;document.getElementById('resetLayout').onclick=resetLayout;
document.getElementById('title').textContent=model.title;document.title=model.title;
if(isAtomic){document.querySelector('.left').setAttribute('aria-label','原子需求衔接图');graph.setAttribute('aria-label','原子需求图：方向键选择原子需求，Shift加方向键选择路线边，Enter显示到达路径，Escape恢复全图');const label=document.querySelector('label.small');label.firstChild.textContent='需求到达路径 ';focusControl.setAttribute('aria-label','选择显示从起始需求到当前需求的到达路径');document.querySelector('.toolbar span').textContent='圆点标记起点 · 点击需求显示到达路径 · 虚线表示重新进入起点';}
document.getElementById('meta').textContent='修订 '+model.revision+' · '+model.states.length+' '+words.nodes+' · '+model.transitions.length+' '+words.edges+' · '+model.constraints.length+' 项全局约束'+(isAtomic?' · 最少 '+artifact.coverage.visitCount+' 次访问（重复 '+artifact.coverage.additionalVisitCount+' 次）':'');
buildLayout();showOverview();new ResizeObserver(resize).observe(graph.parentElement);resize();fit();
